at I drink, and you shall be baptized with the baptism that I am baptized with;"},{"v":40,"t":"but to sit at my right hand and at my left hand is not mine to give, but for whom it has been prepared.”"},{"v":41,"t":"When the ten heard it, they began to be indignant towards James and John."},{"v":42,"t":"Jesus summoned them, and said to them, “You know that they who are recognized as rulers over the nations lord it over them, and their great ones exercise authority over them."},{"v":43,"t":"But it shall not be so among you, but whoever wants to become great among you shall be your servant."},{"v":44,"t":"Whoever of you wants to become first among you, shall be bondservant of all."},{"v":45,"t":"For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many.”"},{"v":46,"t":"They came to Jericho. As he went out from Jericho, with his disciples and a great multitude, the son of Timaeus, Bartimaeus, a blind beggar, was sitting by the road."},{"v":47,"t":"When he heard that it was Jesus the Nazarene, he began to cry out, and say, “Jesus, you son of David, have mercy on me!”"},{"v":48,"t":"Many rebuked him, that he should be quiet, but he cried out much more, “You son of David, have mercy on me!”"},{"v":49,"t":"Jesus stood still, and said, “Call him.” They called the blind man, saying to him, “Cheer up! Get up. He is calling you!”"},{"v":50,"t":"He, casting away his cloak, sprang up, and came to Jesus."},{"v":51,"t":"Jesus asked him, “What do you want me to do for you?” The blind man said to him, “Rabboni, that I may see again.”"},{"v":52,"t":"Jesus said to him, “Go your way. Your faith has made you well.” Immediately he received his sight, and followed Jesus on the way."}]}],"context":"On a mountain, Jesus’ glory shines through for a moment. Then, on the road to Jerusalem, he predicts his death twice more while the disciples argue about who’s the greatest. Jesus keeps turning their values upside down — the greatest is the servant, the kingdom belongs to children, and he came “to give his life as a ransom for many.”","notes":[{"h":"The Transfiguration (9:2–13)","t":"Jesus’ hidden glory briefly breaks through. Moses (the Law) and Elijah (the Prophets) appear — Jesus fulfils them both. The Father’s voice, “listen to him,” echoes the baptism. It’s a glimpse of glory given just before the suffering."},{"h":"“I believe; help my unbelief!” (9:24)","t":"One of the most honest prayers in the Bible — faith and doubt in the same breath. Jesus honours it and heals the man’s son. You don’t need perfect faith to come to him."},{"h":"Greatness redefined (9:33–37)","t":"Caught arguing about who is greatest, Jesus says the first must be last and servant of all — then puts a child in front of them. Welcoming the powerless is welcoming him."},{"h":"The rich man (10:17–31)","t":"Note that Jesus “looked at him and loved him.” The issue isn’t money itself but money as a rival lord. “A camel through a needle’s eye” is deliberate hyperbole — and “with God all things are possible” is the hope."},{"h":"“A ransom for many” (10:45)","t":"The theme verse of the whole Gospel: “The Son of Man came not to be served but to serve, and to give his life as a ransom for many.” A ransom is the price paid to set a captive free. This is Mark’s clearest word on why Jesus came."},{"h":"Blind Bartimaeus (10:46–52)","t":"The last healing before Jerusalem. A blind beggar “sees” who Jesus is (“Son of David”) and follows him on the road — a model disciple, and a bookend to the two‑stage blind man back in chapter 8."}],"questions":[{"q":"Is Jesus against having money?","a":"Not money itself, but money as a master. The rich man’s wealth owned him; Jesus names whatever rivals God as the thing to surrender. “Impossible for man — possible for God.”"},{"q":"Does 9:43–48 mean I should literally harm myself over sin?","a":"No — it’s deliberate hyperbole (like “I’ve told you a thousand times”) meant to jolt us into taking sin with deadly seriousness. It’s a call to radical honesty, not self‑injury."},{"q":"What exactly does “ransom for many” (10:45) mean?","a":"A ransom is the price paid to free a captive. Jesus frames his coming death as the price that liberates us — the clearest statement in Mark of the meaning of the cross."}],"discuss":{"observe":"The disciples keep angling for greatness at the worst possible moments. Where do you catch that same instinct in yourself?","meaning":"Sit with 10:45 — “to serve, and to give his life as a ransom for many.” What does that verse tell you about Jesus, and about God’s heart?","apply":"“Whoever wants to be great among you must be your servant.” What would servant‑greatness look like in our marriage this week — concretely?"},"prayer":"Jesus, you came not to be served but to serve, and to give your life for us. Teach us the upside‑down greatness of the towel and the basin. We believe; help our unbelief. Amen."},{"id":"s6","n":6,"title":"Confrontation in Jerusalem","subtitle":"Mark 11–12","ref":"Mark 11–12","nivUrl":"https://www.biblegateway.com/passage/?search=Mark%2011-12&version=NIV","chapters":[{"n":11,"verses":[{"v":1,"t":"When they came near to Jerusalem, to Bethsphage and Bethany, at the Mount of Olives, he sent two of his disciples,"},{"v":2,"t":"and said to them, “Go your way into the village that is opposite you. Immediately as you enter into it, you will find a young donkey tied, on which no one has sat. Untie him, and bring him."},{"v":3,"t":"If anyone asks you, ‘Why are you doing this?’ say, ‘The Lord needs him;’ and immediately he will send him back here.”"},{"v":4,"t":"They went away, and found a young donkey tied at the door outside in the open street, and they untied him."},{"v":5,"t":"Some of those who stood there asked them, “What are you doing, untying the young donkey?”"},{"v":6,"t":"They said to them just as Jesus had said, and they let them go."},{"v":7,"t":"They brought the young donkey to Jesus, and threw their garments on it, and Jesus sat on it."},{"v":8,"t":"Many spread their garments on the way, and others were cutting down branches from the trees, and spreading them on the road."},{"v":9,"t":"Those who went in front, and those who followed, cried out, “Hosanna! Blessed is he who comes in the name of the Lord!"},{"v":10,"t":"Blessed is the kingdom of our father David that is coming in the name of the Lord! Hosanna in the highest!”"},{"v":11,"t":"Jesus entered into the temple in Jerusalem. When he had looked around at everything, it being now evening, he went out to Bethany with the twelve."},{"v":12,"t":"The next day, when they had come out from Bethany, he was hungry."},{"v":13,"t":"Seeing a fig tree afar off having leaves, he came to see if perhaps he might find anything on it. When he came to it, he found nothing but leaves, for it was not the season for figs."},{"v":14,"t":"Jesus told it, “May no one ever eat fruit from you again!” and his disciples heard it."},{"v":15,"t":"They came to Jerusalem, and Jesus entered into the temple, and began to throw out those who sold and those who bought in the temple, and overthrew the money changers’ tables, and the seats of those who sold the doves."},{"v":16,"t":"He would not allow anyone to carry a container through the temple."},{"v":17,"t":"He taught, saying to them, “Isn’t it written, ‘My house will be called a house of prayer for all the nations?’ But you have made it a den of robbers!”"},{"v":18,"t":"The chief priests and the scribes heard it, and sought how they might destroy him. For they feared him, because all the multitude was astonished at his teaching."},{"v":19,"t":"When evening came, he went out of the city."},{"v":20,"t":"As they passed by in the morning, they saw the fig tree withered away from the roots."},{"v":21,"t":"Peter, remembering, said to him, “Rabbi, look! The fig tree which you cursed has withered away.”"},{"v":22,"t":"Jesus answered them, “Have faith in God."},{"v":23,"t":"For most certainly I tell you, whoever may tell this mountain, ‘Be taken up and cast into the sea,’ and doesn’t doubt in his heart, but believes that what he says is happening; he shall have whatever he says."},{"v":24,"t":"Therefore I tell you, all things whatever you pray and ask for, believe that you have received them, and you shall have them."},{"v":25,"t":"Whenever you stand praying, forgive, if you have anything against anyone; so that your Father, who is in heaven, may also forgive you your transgressions."},{"v":26,"t":"But if you do not forgive, neither will your Father in heaven forgive your transgressions.”"},{"v":27,"t":"They came again to Jerusalem, and as he was walking in the temple, the chief priests, and the scribes, and the elders came to him,"},{"v":28,"t":"and they began saying to him, “By what authority do you do these things? Or who gave you this authority to do these things?”"},{"v":29,"t":"Jesus said to them, “I will ask you one question. Answer me, and I will tell you by what authority I do these things."},{"v":30,"t":"The baptism of John—was it from heaven, or from men? Answer me.”"},{"v":31,"t":"They reasoned with themselves, saying, “If we should say, ‘From heaven;’ he will say, ‘Why then did you not believe him?’"},{"v":32,"t":"If we should say, ‘From men’”—they feared the people, for all held John to really be a prophet."},{"v":33,"t":"They answered Jesus, “We don’t know.” Jesus said to them, “Neither do I tell you by what authority I do these things.”"}]},{"n":12,"verses":[{"v":1,"t":"He began to speak to them in parables. “A man planted a vineyard, put a hedge around it, dug a pit for the wine press, built a tower, rented it out to a farmer, and went into another country."},{"v":2,"t":"When it was time, he sent a servant to the farmer to get from the farmer his share of the fruit of the vineyard."},{"v":3,"t":"They took him, beat him, and sent him away empty."},{"v":4,"t":"Again, he sent another servant to them; and they threw stones at him, wounded him in the head, and sent him away shamefully treated."},{"v":5,"t":"Again he sent another; and they killed him; and many others, beating some, and killing some."},{"v":6,"t":"Therefore still having one, his beloved son, he sent him last to them, saying, ‘They will respect my son.’"},{"v":7,"t":"But those farmers said among themselves, ‘This is the heir. Come, let’s kill him, and the inheritance will be ours.’"},{"v":8,"t":"They took him, killed him, and cast him out of the vineyard."},{"v":9,"t":"What therefore will the lord of the vineyard do? He will come and destroy the farmers, and will give the vineyard to others."},{"v":10,"t":"Haven’t you even read this Scripture: ‘The stone which the builders rejected, the same was made the head of the corner."},{"v":11,"t":"This was from the Lord, it is marvelous in our eyes’?”"},{"v":12,"t":"They tried to seize him, but they feared the multitude; for they perceived that he spoke the parable against them. They left him, and went away."},{"v":13,"t":"They sent some of the Pharisees and the Herodians to him, that they might trap him with words."},{"v":14,"t":"When they had come, they asked him, “Teacher, we know that you are honest, and don’t defer to anyone; for you aren’t partial to anyone, but truly teach the way of God. Is it lawful to pay taxes to Caesar, or not?"},{"v":15,"t":"Shall we give, or shall we not give?” But he, knowing their hypocrisy, said to them, “Why do you test me? Bring me a denarius, that I may see it.”"},{"v":16,"t":"They brought it. He said to them, “Whose is this image and inscription?” They said to him, “Caesar’s.”"},{"v":17,"t":"Jesus answered them, “Render to Caesar the things that are Caesar’s, and to God the things that are God’s.” They marveled greatly at him."},{"v":18,"t":"There came to him Sadducees, who say that there is no resurrection. They asked him, saying,"},{"v":19,"t":"“Teacher, Moses wrote to us, ‘If a man’s brother dies, and leaves a wife behind him, and leaves no children, that his brother should take his wife, and raise up offspring for his brother.’"},{"v":20,"t":"There were seven brothers. The first took a wife, and dying left no offspring."},{"v":21,"t":"The second took her, and died, leaving no children behind him. The third likewise;"},{"v":22,"t":"and the seven took her and left no children. Last of all the woman also died."},{"v":23,"t":"In the resurrection, when they rise, whose wife will she be of them? For the seven had her as a wife.”"},{"v":24,"t":"Jesus answered them, “Isn’t this because you are mistaken, not knowing the Scriptures, nor the power of God?"},{"v":25,"t":"For when they will rise from the dead, they neither marry, nor are given in marriage, but are like angels in heaven."},{"v":26,"t":"But about the dead, that they are raised; haven’t you read in the book of Moses, about the Bush, how God spoke to him, saying, ‘I am the God of Abraham, the God of Isaac, and the God of Jacob’?"},{"v":27,"t":"He is not the God of the dead, but of the living. You are therefore badly mistaken.”"},{"v":28,"t":"One of the scribes came, and heard them questioning together. Knowing that he had answered them well, asked him, “Which commandment is the greatest of all?”"},{"v":29,"t":"Jesus answered, “The greatest is, ‘Hear, Israel, the Lord our God, the Lord is one:"},{"v":30,"t":"you shall love the Lord your God with all your heart, and with all your soul, and with all your mind, and with all your strength.’ This is the first commandment."},{"v":31,"t":"The second is like this, ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these.”"},{"v":32,"t":"The scribe said to him, “Truly, teacher, you have said well that he is one, and there is none other but he,"},{"v":33,"t":"and to love him with all the heart, and with all the understanding, with all the soul, and with all the strength, and to love his neighbor as himself, is more important than all whole burnt offerings and sacrifices.”"},{"v":34,"t":"When Jesus saw that he answered wisely, he said to him, “You are not far from God’s Kingdom.” No one dared ask him any question after that."},{"v":35,"t":"Jesus responded, as he taught in the temple, “How is it that the scribes say that the Christ is the son of David?"},{"v":36,"t":"For David himself said in the Holy Spirit, ‘The Lord said to my Lord, “Sit at my right hand, until I make your enemies the footstool of your feet.”’"},{"v":37,"t":"Therefore David himself calls him Lord, so how can he be his son?” The common people heard him gladly."},{"v":38,"t":"In his teaching he said to them, “Beware of the scribes, who like to walk in long robes, and to get greetings in the marketplaces,"},{"v":39,"t":"and the best seats in the synagogues, and the best places at feasts:"},{"v":40,"t":"those who devour widows’ houses, and for a pretense make long prayers. These will receive greater condemnation.”"},{"v":41,"t":"Jesus sat down opposite the treasury, and saw how the multitude cast money into the treasury. Many who were rich cast in much."},{"v":42,"t":"A poor widow came, and she cast in two small brass coins, which equal a quadrans coin."},{"v":43,"t":"He called his disciples to himself, and said to them, “Most certainly I tell you, this poor widow gave more than all those who are giving into the treasury,"},{"v":44,"t":"for they all gave out of their abundance, but she, out of her poverty, gave all that she had to live on.”"}]}],"context":"Jesus enters Jerusalem to shouts of “Hosanna,” clears the temple, and spends his final days in a series of showdowns with the authorities — out‑answering every trap and exposing hollow religion, while quietly commending a widow’s tiny, total gift.","notes":[{"h":"The entry on a colt (11:1–11)","t":"Riding a young donkey fulfils Zechariah 9:9 — a king coming in peace, not a warhorse. “Hosanna” means “save now!” Jesus is staging a deliberate, humble royal arrival."},{"h":"The fig tree and the temple (11:12–25)","t":"Another Markan “sandwich”: the cursing of a leafy‑but‑fruitless fig tree wraps around the temple cleansing. The barren tree is an acted parable of a religion that looks alive but bears no fruit."},{"h":"Clearing the temple (11:15–19)","t":"“A house of prayer for all nations” had become “a den of robbers.” The commerce had crowded into the one court where outsiders (Gentiles) could pray. This is focused, prophetic protest — not a loss of temper."},{"h":"The tenants (12:1–12)","t":"A pointed parable: the vineyard is Israel, the tenants are the leaders, and the beloved son they kill is Jesus himself. The leaders understand exactly — and it hardens them."},{"h":"“Render to Caesar” (12:13–17)","t":"The coin bears Caesar’s image, so give it back to him. The real punch: you bear God’s image — so give God his due, which is yourself."},{"h":"The widow’s two coins (12:41–44)","t":"She gave “all she had to live on.” Jesus measures a gift not by its size but by its cost to the giver — and this tiny gift is the largest in the room."}],"questions":[{"q":"Why curse a fig tree for having no figs when it wasn’t even the season (11:13)?","a":"It’s a deliberate acted parable, not petulance. The leafy‑but‑fruitless tree pictures a religion that looks alive but produces nothing — exactly what Jesus confronts in the temple that same day."},{"q":"Was clearing the temple Jesus “losing his temper”?","a":"No — it was deliberate, prophetic action: a planned protest against a system exploiting worshippers and shutting out the nations, backed by quotes from Isaiah and Jeremiah. Focused, righteous anger, not a tantrum."},{"q":"“Render to Caesar” — is Jesus just endorsing paying taxes?","a":"He sidesteps the trap and reframes it. Yes, give Caesar his coin — but the weight falls on “give God what bears God’s image,” which is you."}],"discuss":{"observe":"Everyone in these chapters tries to trap Jesus, and he never loses control of the conversation. What does the way he handles opposition show you about him?","meaning":"Jesus says all of God’s commands come down to loving God fully and loving your neighbour as yourself. Why do you think he refused to make it more complicated?","apply":"The widow gave “all she had to live on.” Giving is measured by cost, not amount. Where might God be inviting us to a gift — of money, time, or ourselves — that actually costs us something?"},"prayer":"Lord, cleanse the temple of our hearts. Help us love you with everything and love our neighbour as ourselves — and to give not from our leftovers but from real trust. Amen."},{"id":"s7","n":7,"title":"The Last Night","subtitle":"Mark 13–14","ref":"Mark 13–14","nivUrl":"https://www.biblegateway.com/passage/?search=Mark%2013-14&version=NIV","chapters":[{"n":13,"verses":[{"v":1,"t":"As he went out of the temple, one of his disciples said to him, “Teacher, see what kind of stones and what kind of buildings!”"},{"v":2,"t":"Jesus said to him, “Do you see these great buildings? There will not be left here one stone on another, which will not be thrown down.”"},{"v":3,"t":"As he sat on the Mount of Olives opposite the temple, Peter, James, John, and Andrew asked him privately,"},{"v":4,"t":"“Tell us, when will these things be? What is the sign that these things are all about to be fulfilled?”"},{"v":5,"t":"Jesus, answering, began to tell them, “Be careful that no one leads you astray."},{"v":6,"t":"For many will come in my name, saying, ‘I am he!’ and will lead many astray."},{"v":7,"t":"“When you hear of wars and rumors of wars, don’t be troubled. For those must happen, but the end is not yet."},{"v":8,"t":"For nation will rise against nation, and kingdom against kingdom. There will be earthquakes in various places. There will be famines and troubles. These things are the beginning of birth pains."},{"v":9,"t":"But watch yourselves, for they will deliver you up to councils. You will be beaten in synagogues. You will stand before rulers and kings for my sake, for a testimony to them."},{"v":10,"t":"The Good News must first be preached to all the nations."},{"v":11,"t":"When they lead you away and deliver you up, don’t be anxious beforehand, or premeditate what you will say, but say whatever will be given you in that hour. For it is not you who speak, but the Holy Spirit."},{"v":12,"t":"“Brother will deliver up brother to death, and the father his child. Children will rise up against parents, and cause them to be put to death."},{"v":13,"t":"You will be hated by all men for my name’s sake, but he who endures to the end, the same will be saved."},{"v":14,"t":"But when you see the abomination of desolation, spoken of by Daniel the prophet, standing where it ought not (let the reader understand), then let those who are in Judea flee to the mountains,"},{"v":15,"t":"and let him who is on the housetop not go down, nor enter in, to take anything out of his house."},{"v":16,"t":"Let him who is in the field not return back to take his cloak."},{"v":17,"t":"But woe to those who are with child and to those who nurse babies in those days!"},{"v":18,"t":"Pray that your flight won’t be in the winter."},{"v":19,"t":"For in those days there will be oppression, such as there has not been the like from the beginning of the creation which God created until now, and never will be."},{"v":20,"t":"Unless the Lord had shortened the days, no flesh would have been saved; but for the sake of the chosen ones, whom he picked out, he shortened the days."},{"v":21,"t":"Then if anyone tells you, ‘Look, here is the Christ!’ or, ‘Look, there!’ don’t believe it."},{"v":22,"t":"For there will arise false christs and false prophets, and will show signs and wonders, that they may lead astray, if possible, even the chosen ones."},{"v":23,"t":"But you watch. “Behold, I have told you all things beforehand."},{"v":24,"t":"But in those days, after that oppression, the sun will be darkened, the moon will not give its light,"},{"v":25,"t":"the stars will be falling from the sky, and the powers that are in the heavens will be shaken."},{"v":26,"t":"Then they will see the Son of Man coming in clouds with great power and glory."},{"v":27,"t":"Then he will send out his angels, and will gather together his chosen ones from the four winds, from the ends of the earth to the ends of the sky."},{"v":28,"t":"“Now from the fig tree, learn this parable. When the branch has now become tender, and produces its leaves, you know that the summer is near;"},{"v":29,"t":"even so you also, when you see these things coming to pass, know that it is near, at the doors."},{"v":30,"t":"Most certainly I say to you, this generation will not pass away until all these things happen."},{"v":31,"t":"Heaven and earth will pass away, but my words will not pass away."},{"v":32,"t":"But of that day or that hour no one knows, not even the angels in heaven, nor the Son, but only the Father."},{"v":33,"t":"Watch, keep alert, and pray; for you don’t know when the time is."},{"v":34,"t":"“It is like a man, traveling to another country, having left his house, and given authority to his servants, and to each one his work, and also commanded the doorkeeper to keep watch."},{"v":35,"t":"Watch therefore, for you don’t know when the lord of the house is coming, whether at evening, or at midnight, or when the rooster crows, or in the morning;"},{"v":36,"t":"lest coming suddenly he might find you sleeping."},{"v":37,"t":"What I tell you, I tell all: Watch.”"}]},{"n":14,"verses":[{"v":1,"t":"It was now two days before the feast of the Passover and the unleavened bread, and the chief priests and the scribes sought how they might seize him by deception, and kill him."},{"v":2,"t":"For they said, “Not during the feast, because there might be a riot among the people.”"},{"v":3,"t":"While he was at Bethany, in the house of Simon the leper, as he sat at the table, a woman came having an alabaster jar of ointment of pure nard—very costly. She broke the jar, and poured it over his head."},{"v":4,"t":"But there were some who were indignant among themselves, saying, “Why has this ointment been wasted?"},{"v":5,"t":"For this might have been sold for more than three hundred denarii, and given to the poor.” They grumbled against her."},{"v":6,"t":"But Jesus said, “Leave her alone. Why do you trouble her? She has done a good work for me."},{"v":7,"t":"For you always have the poor with you, and whenever you want to, you can do them good; but you will not always have me."},{"v":8,"t":"She has done what she could. She has anointed my body beforehand for the burying."},{"v":9,"t":"Most certainly I tell you, wherever this Good News may be preached throughout the whole world, that which this woman has done will also be spoken of for a memorial of her.”"},{"v":10,"t":"Judas Iscariot, who was one of the twelve, went away to the chief priests, that he might deliver him to them."},{"v":11,"t":"They, when they heard it, were glad, and promised to give him money. He sought how he might conveniently deliver him."},{"v":12,"t":"On the first day of unleavened bread, when they sacrificed the Passover, his disciples asked him, “Where do you want us to go and prepare that you may eat the Passover?”"},{"v":13,"t":"He sent two of his disciples, and said to them, “Go into the city, and there you will meet a man carrying a pitcher of water. Follow him,"},{"v":14,"t":"and wherever he enters in, tell the master of the house, ‘The Teacher says, “Where is the guest room, where I may eat the Passover with my disciples?”’"},{"v":15,"t":"He will himself show you a large upper room furnished and ready. Get ready for us there.”"},{"v":16,"t":"His disciples went out, and came into the city, and found things as he had said to them, and they prepared the Passover."},{"v":17,"t":"When it was evening he came with the twelve."},{"v":18,"t":"As they sat and were eating, Jesus said, “Most certainly I tell you, one of you will betray me—he who eats with me.”"},{"v":19,"t":"They began to be sorrowful, and to ask him one by one, “Surely not I?” And another said, “Surely not I?”"},{"v":20,"t":"He answered them, “It is one of the twelve, he who dips with me in the dish."},{"v":21,"t":"For the Son of Man goes, even as it is written about him, but woe to that man by whom the Son of Man is betrayed! It would be better for that man if he had not been born.”"},{"v":22,"t":"As they were eating, Jesus took bread, and when he had blessed, he broke it, and gave to them, and said, “Take, eat. This is my body.”"},{"v":23,"t":"He took the cup, and when he had given thanks, he gave to them. They all drank of it."},{"v":24,"t":"He said to them, “This is my blood of the new covenant, which is poured out for many."},{"v":25,"t":"Most certainly I tell you, I will no more drink of the fruit of the vine, until that day when I drink it anew in God’s Kingdom.”"},{"v":26,"t":"When they had sung a hymn, they went out to the Mount of Olives."},{"v":27,"t":"Jesus said to them, “All of you will be made to stumble because of me tonight, for it is written, ‘I will strike the shepherd, and the sheep will be scattered.’"},{"v":28,"t":"However, after I am raised up, I will go before you into Galilee.”"},{"v":29,"t":"But Peter said to him, “Although all will be offended, yet I will not.”"},{"v":30,"t":"Jesus said to him, “Most certainly I tell you, that you today, even this night, before the rooster crows twice, you will deny me three times.”"},{"v":31,"t":"But he spoke all the more, “If I must die with you, I will not deny you.” They all said the same thing."},{"v":32,"t":"They came to a place which was named Gethsemane. He said to his disciples, “Sit here, while I pray.”"},{"v":33,"t":"He took with him Peter, James, and John, and began to be greatly troubled and distressed."},{"v":34,"t":"He said to them, “My soul is exceedingly sorrowful, even to death. Stay here, and watch.”"},{"v":35,"t":"He went forward a little, and fell on the ground, and prayed that, if it were possible, the hour might pass away from him."},{"v":36,"t":"He said, “Abba, Father, all things are possible to you. Please remove this cup from me. However, not what I desire, but what you desire.”"},{"v":37,"t":"He came and found them sleeping, and said to Peter, “Simon, are you sleeping? Couldn’t you watch one hour?"},{"v":38,"t":"Watch and pray, that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.”"},{"v":39,"t":"Again he went away, and prayed, saying the same words."},{"v":40,"t":"Again he returned, and found them sleeping, for their eyes were very heavy, and they didn’t know what to answer him."},{"v":41,"t":"He came the third time, and said to them, “Sleep on now, and take your rest. It is enough. The hour has come. Behold, the Son of Man is betrayed into the hands of sinners."},{"v":42,"t":"Arise, let us be going. Behold, he who betrays me is at hand.”"},{"v":43,"t":"Immediately, while he was still speaking, Judas, one of the twelve, came—and with him a multitude with swords and clubs, from the chief priests, the scribes, and the elders."},{"v":44,"t":"Now he who betrayed him had given them a sign, saying, “Whomever I will kiss, that is he. Seize him, and lead him away safely.”"},{"v":45,"t":"When he had come, immediately he came to him, and said, “Rabbi! Rabbi!” and kissed him."},{"v":46,"t":"They laid their hands on him, and seized him."},{"v":47,"t":"But a certain one of those who stood by drew his sword, and struck the servant of the high priest, and cut off his ear."},{"v":48,"t":"Jesus answered them, “Have you come out, as against a robber, with swords and clubs to seize me?"},{"v":49,"t":"I was daily with you in the temple teaching, and you didn’t arrest me. But this is so that the Scriptures might be fulfilled.”"},{"v":50,"t":"They all left him, and fled."},{"v":51,"t":"A certain young man followed him, having a linen cloth thrown around himself over his naked body. The young men grabbed him,"},{"v":52,"t":"but he left the linen cloth, and fled from them naked."},{"v":53,"t":"They led Jesus away to the high priest. All the chief priests, the elders, and the scribes came together with him."},{"v":54,"t":"Peter had followed him from a distance, until he came into the court of the high priest. He was sitting with the officers, and warming himself in the light of the fire."},{"v":55,"t":"Now the chief priests and the whole council sought witnesses against Jesus to put him to death, and found none."},{"v":56,"t":"For many gave false testimony against him, and their testimony didn’t agree with each other."},{"v":57,"t":"Some stood up, and gave false testimony against him, saying,"},{"v":58,"t":"“We heard him say, ‘I will destroy this temple that is made with hands, and in three days I will build another made without hands.’”"},{"v":59,"t":"Even so, their testimony did not agree."},{"v":60,"t":"The high priest stood up in the middle, and asked Jesus, “Have you no answer? What is it which these testify against you?”"},{"v":61,"t":"But he stayed quiet, and answered nothing. Again the high priest asked him, “Are you the Christ, the Son of the Blessed?”"},{"v":62,"t":"Jesus said, “I am. You will see the Son of Man sitting at the right hand of Power, and coming with the clouds of the sky.”"},{"v":63,"t":"The high priest tore his clothes, and said, “What further need have we of witnesses?"},{"v":64,"t":"You have heard the blasphemy! What do you think?” They all condemned him to be worthy of death."},{"v":65,"t":"Some began to spit on him, and to cover his face, and to beat him with fists, and to tell him, “Prophesy!” The officers struck him with the palms of their hands."},{"v":66,"t":"As Peter was in the courtyard below, one of the maids of the high priest came,"},{"v":67,"t":"and seeing Peter warming himself, she looked at him, and said, “You were also with the Nazarene, Jesus!”"},{"v":68,"t":"But he denied it, saying, “I neither know, nor understand what you are saying.” He went out on the porch, and the rooster crowed."},{"v":69,"t":"The maid saw him, and began again to tell those who stood by, “This is one of them.”"},{"v":70,"t":"But he again denied it. After a little while again those who stood by said to Peter, “You truly are one of them, for you are a Galilean, and your speech shows it.”"},{"v":71,"t":"But he began to curse, and to swear, “I don’t know this man of whom you speak!”"},{"v":72,"t":"The rooster crowed the second time. Peter remembered the word, how that Jesus said to him, “Before the rooster crows twice, you will deny me three times.” When he thought about that, he wept."}]}],"context":"Jesus warns of coming upheaval and calls his followers to stay awake and faithful. Then the final night unfolds: a woman anoints him for burial, Judas plots betrayal, Jesus shares the Last Supper, prays in agony in Gethsemane, is arrested and abandoned, and is denied three times by Peter.","notes":[{"h":"“Stay awake” (chapter 13)","t":"Jesus foretells the temple’s destruction (fulfilled in AD 70) and speaks of the end. The repeated command is simply “watch, stay awake” — and he says plainly that “no one knows the day or hour, not even the Son” (13:32)."},{"h":"Devotion beside betrayal (14:1–11)","t":"A woman “wastes” costly perfume on Jesus, and he calls it beautiful — she has prepared him for burial. Mark sandwiches this extravagant love right against Judas’ plot to betray him. Two responses to Jesus, side by side."},{"h":"The Last Supper (14:12–26)","t":"At the Passover meal Jesus reinterprets everything around himself: “this is my body… my blood of the covenant, poured out for many.” This is the meal that becomes communion."},{"h":"Gethsemane (14:32–42)","t":"“Abba, Father… take this cup from me — yet not what I will, but what you will.” “Abba” is the intimate Aramaic word for father, like “Papa.” His agony is real, and so is his surrender. Meanwhile the disciples fall asleep."},{"h":"“I am” (14:61–62)","t":"Before the council, asked if he is the Christ, Jesus finally says openly, “I am,” and quotes Daniel 7. The secret is out — at the very moment it will cost him his life."},{"h":"Peter’s denial (14:66–72)","t":"Three times, then the rooster, then tears. The disciple who promised the most fails the hardest — yet, as we’ll see, this is not the end of his story."}],"questions":[{"q":"Is the “end times” chapter (13) about our future?","a":"Much of it describes the temple’s fall in AD 70 — within that generation (13:30) — and it blends near and far horizons. Jesus’ point isn’t a datable prediction; it’s a repeated command to stay awake and faithful, since even he says he doesn’t know the day (13:32)."},{"q":"Why did Jesus pray to avoid the cross if he came to die?","a":"Gethsemane shows his real humanity — the horror was genuine, not play‑acting. The victory is in the surrender: “not what I will, but what you will.” His willingness cost him everything."},{"q":"How could Peter deny Jesus after everything?","a":"Fear. Mark is bracingly honest that the “best” disciple collapsed — which is oddly comforting: this gospel is for failures. And Peter is later singled out for restoration (16:7)."}],"discuss":{"observe":"Mark sets extravagant devotion (the woman’s anointing) right next to betrayal (Judas). What do those two responses to Jesus stir in you?","meaning":"In Gethsemane Jesus prays, “not what I will, but what you will.” What does it cost to pray that — and where is it hard for you to mean it?","apply":"Jesus asked his friends simply to “stay awake” with him, and they couldn’t. How can the two of us stay awake to God in a demanding week — and stay awake to each other?"},"prayer":"Jesus, in the garden you chose the Father’s will over your own comfort. When we are weak and sleepy, keep us near you. Thank you for a love that held on even as friends fell away. Amen."},{"id":"s8","n":8,"title":"The Cross and the Empty Tomb","subtitle":"Mark 15–16","ref":"Mark 15–16","nivUrl":"https://www.biblegateway.com/passage/?search=Mark%2015-16&version=NIV","chapters":[{"n":15,"verses":[{"v":1,"t":"Immediately in the morning the chief priests, with the elders and scribes, and the whole council, held a consultation, and bound Jesus, and carried him away, and delivered him up to Pilate."},{"v":2,"t":"Pilate asked him, “Are you the King of the Jews?” He answered, “So you say.”"},{"v":3,"t":"The chief priests accused him of many things."},{"v":4,"t":"Pilate again asked him, “Have you no answer? See how many things they testify against you!”"},{"v":5,"t":"But Jesus made no further answer, so that Pilate marveled."},{"v":6,"t":"Now at the feast he used to release to them one prisoner, whom they asked of him."},{"v":7,"t":"There was one called Barabbas, bound with his fellow insurgents, men who in the insurrection had committed murder."},{"v":8,"t":"The multitude, crying aloud, began to ask him to do as he always did for them."},{"v":9,"t":"Pilate answered them, saying, “Do you want me to release to you the King of the Jews?”"},{"v":10,"t":"For he perceived that for envy the chief priests had delivered him up."},{"v":11,"t":"But the chief priests stirred up the multitude, that he should release Barabbas to them instead."},{"v":12,"t":"Pilate again asked them, “What then should I do to him whom you call the King of the Jews?”"},{"v":13,"t":"They cried out again, “Crucify him!”"},{"v":14,"t":"Pilate said to them, “Why, what evil has he done?” But they cried out exceedingly, “Crucify him!”"},{"v":15,"t":"Pilate, wishing to please the multitude, released Barabbas to them, and handed over Jesus, when he had flogged him, to be crucified."},{"v":16,"t":"The soldiers led him away within the court, which is the Praetorium; and they called together the whole cohort."},{"v":17,"t":"They clothed him with purple, and weaving a crown of thorns, they put it on him."},{"v":18,"t":"They began to salute him, “Hail, King of the Jews!”"},{"v":19,"t":"They struck his head with a reed, and spat on him, and bowing their knees, did homage to him."},{"v":20,"t":"When they had mocked him, they took the purple off him, and put his own garments on him. They led him out to crucify him."},{"v":21,"t":"They compelled one passing by, coming from the country, Simon of Cyrene, the father of Alexander and Rufus, to go with them, that he might bear his cross."},{"v":22,"t":"They brought him to the place called Golgotha, which is, being interpreted, “The place of a skull.”"},{"v":23,"t":"They offered him wine mixed with myrrh to drink, but he didn’t take it."},{"v":24,"t":"Crucifying him, they parted his garments among them, casting lots on them, what each should take."},{"v":25,"t":"It was the third hour, and they crucified him."},{"v":26,"t":"The superscription of his accusation was written over him, “THE KING OF THE JEWS.”"},{"v":27,"t":"With him they crucified two robbers; one on his right hand, and one on his left."},{"v":28,"t":"The Scripture was fulfilled, which says, “He was counted with transgressors.”"},{"v":29,"t":"Those who passed by blasphemed him, wagging their heads, and saying, “Ha! You who destroy the temple, and build it in three days,"},{"v":30,"t":"save yourself, and come down from the cross!”"},{"v":31,"t":"Likewise, also the chief priests mocking among themselves with the scribes said, “He saved others. He can’t save himself."},{"v":32,"t":"Let the Christ, the King of Israel, now come down from the cross, that we may see and believe him.” Those who were crucified with him also insulted him."},{"v":33,"t":"When the sixth hour had come, there was darkness over the whole land until the ninth hour."},{"v":34,"t":"At the ninth hour Jesus cried with a loud voice, saying, “Eloi, Eloi, lama sabachthani?” which is, being interpreted, “My God, my God, why have you forsaken me?”"},{"v":35,"t":"Some of those who stood by, when they heard it, said, “Behold, he is calling Elijah.”"},{"v":36,"t":"One ran, and filling a sponge full of vinegar, put it on a reed, and gave it to him to drink, saying, “Let him be. Let’s see whether Elijah comes to take him down.”"},{"v":37,"t":"Jesus cried out with a loud voice, and gave up the spirit."},{"v":38,"t":"The veil of the temple was torn in two from the top to the bottom."},{"v":39,"t":"When the centurion, who stood by opposite him, saw that he cried out like this and breathed his last, he said, “Truly this man was the Son of God!”"},{"v":40,"t":"There were also women watching from afar, among whom were both Mary Magdalene, and Mary the mother of James the less and of Joses, and Salome;"},{"v":41,"t":"who, when he was in Galilee, followed him, and served him; and many other women who came up with him to Jerusalem."},{"v":42,"t":"When evening had now come, because it was the Preparation Day, that is, the day before the Sabbath,"},{"v":43,"t":"Joseph of Arimathaea, a prominent council member who also himself was looking for God’s Kingdom, came. He boldly went in to Pilate, and asked for Jesus’ body."},{"v":44,"t":"Pilate marveled if he were already dead; and summoning the centurion, he asked him whether he had been dead long."},{"v":45,"t":"When he found out from the centurion, he granted the body to Joseph."},{"v":46,"t":"He bought a linen cloth, and taking him down, wound him in the linen cloth, and laid him in a tomb which had been cut out of a rock. He rolled a stone against the door of the tomb."},{"v":47,"t":"Mary Magdalene and Mary, the mother of Joses, saw where he was laid."}]},{"n":16,"verses":[{"v":1,"t":"When the Sabbath was past, Mary Magdalene, and Mary the mother of James, and Salome, bought spices, that they might come and anoint him."},{"v":2,"t":"Very early on the first day of the week, they came to the tomb when the sun had risen."},{"v":3,"t":"They were saying among themselves, “Who will roll away the stone from the door of the tomb for us?”"},{"v":4,"t":"for it was very big. Looking up, they saw that the stone was rolled back."},{"v":5,"t":"Entering into the tomb, they saw a young man sitting on the right side, dressed in a white robe, and they were amazed."},{"v":6,"t":"He said to them, “Don’t be amazed. You seek Jesus, the Nazarene, who has been crucified. He has risen. He is not here. Behold, the place where they laid him!"},{"v":7,"t":"But go, tell his disciples and Peter, ‘He goes before you into Galilee. There you will see him, as he said to you.’”"},{"v":8,"t":"They went out, and fled from the tomb, for trembling and astonishment had come on them. They said nothing to anyone; for they were afraid."},{"v":9,"t":"Now when he had risen early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons."},{"v":10,"t":"She went and told those who had been with him, as they mourned and wept."},{"v":11,"t":"When they heard that he was alive, and had been seen by her, they disbelieved."},{"v":12,"t":"After these things he was revealed in another form to two of them, as they walked, on their way into the country."},{"v":13,"t":"They went away and told it to the rest. They didn’t believe them, either."},{"v":14,"t":"Afterward he was revealed to the eleven themselves as they sat at the table, and he rebuked them for their unbelief and hardness of heart, because they didn’t believe those who had seen him after he had risen."},{"v":15,"t":"He said to them, “Go into all the world, and preach the Good News to the whole creation."},{"v":16,"t":"He who believes and is baptized will be saved; but he who disbelieves will be condemned."},{"v":17,"t":"These signs will accompany those who believe: in my name they will cast out demons; they will speak with new languages;"},{"v":18,"t":"they will take up serpents; and if they drink any deadly thing, it will in no way hurt them; they will lay hands on the sick, and they will recover.”"},{"v":19,"t":"So then the Lord, after he had spoken to them, was received up into heaven, and sat down at the right hand of God."},{"v":20,"t":"They went out, and preached everywhere, the Lord working with them, and confirming the word by the signs that followed. Amen."}]}],"context":"The story reaches its centre. Jesus is tried before Pilate, mocked, crucified, and buried. Then, on the first day of the week, women find the tomb empty and hear the impossible news: “He is risen.” Everything Mark has been racing toward arrives here.","notes":[{"h":"Barabbas (15:6–15)","t":"A real insurrectionist and murderer is released while the innocent Jesus is condemned in his place — a living picture of substitution: the guilty man goes free, and the innocent one takes his sentence."},{"h":"“Why have you forsaken me?” (15:33–34)","t":"From the cross Jesus quotes Psalm 22 — a psalm that begins in anguish and ends in vindication. He genuinely bears the darkness here; Christians have long understood him to be taking on what our sin deserves. It’s the costliest moment of love, not a divine failure."},{"h":"The torn curtain (15:38)","t":"At the moment Jesus dies, the temple curtain that walled off God’s presence tears from top to bottom. The way to God is now thrown open — through his death."},{"h":"The centurion (15:39)","t":"A Gentile Roman soldier — the man who ran the execution — is the first human in Mark to say, “Truly this man was the Son of God.” Mark’s climax: you finally understand who Jesus is by watching him die."},{"h":"The empty tomb (16:1–8)","t":"“He is risen! He is not here.” The women flee in fear and amazement. Notice that the message names Peter specifically — “tell his disciples and Peter” — pure grace for the man who denied him."},{"h":"About the ending (16:9–20)","t":"The earliest and best manuscripts end at 16:8, and most Bibles flag verses 9–20 as a later addition. Nothing essential hangs on them — the resurrection is already announced at the empty tomb. The abrupt ending may even be deliberate, leaving the response to you."}],"questions":[{"q":"“My God, why have you forsaken me?” — did God abandon Jesus?","a":"Jesus is quoting Psalm 22, which starts in anguish and ends in trust and vindication. He truly bore the weight and darkness of the cross; Christians have long understood him here as taking on what our sin deserves. It’s the deepest moment of love, not divine failure."},{"q":"Why do many Bibles note that Mark 16:9–20 may not be original?","a":"The earliest, most reliable manuscripts end at 16:8. The longer ending was likely added later to round off the abrupt finish. Your Bible flags it simply for honesty — and nothing essential depends on it, since the resurrection is announced at the empty tomb (16:6)."},{"q":"Why would Mark end so abruptly, with the women afraid?","a":"Many think it’s deliberate. The open ending throws the question back to you: the tomb is empty, the messenger says “go and tell.” How will you respond?"}],"discuss":{"observe":"A Roman executioner, watching Jesus die, says, “Truly this man was the Son of God.” Why do you think Mark saves that confession for the cross, of all places?","meaning":"The temple curtain tears open the very moment Jesus dies. What does it mean to you that the way to God is now wide open?","apply":"The messenger says, “Go, tell his disciples — and Peter.” Having walked through Mark together, what’s one thing you don’t want to leave behind here — something to carry, or someone to tell?"},"prayer":"Jesus, you took Barabbas’ place — and ours. Thank you for the torn curtain and the empty tomb. Risen Lord, don’t let us walk away unchanged; make us people who go and tell. Amen."}]};</script>
<script>
/* Bible Study Companion — app logic (vanilla, self-contained) */
(function () {
  "use strict";
  var DATA = window.__BSC_DATA__;
  var SESSIONS = DATA.sessions;
  var LS_KEY = "bsc_mark_v1";
  var QUEUE_KEY = "bsc_mark_v1_pending";
  var WEBHOOK_URL = "https://n8nroycris.up.railway.app/webhook/session-complete";
  var SYNC_SAVE_URL = "https://n8nroycris.up.railway.app/webhook/progress-save";
  var SYNC_LOAD_URL = "https://n8nroycris.up.railway.app/webhook/progress-load";

  /* ---------- state ---------- */
  function load() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
    catch (e) { return {}; }
  }
  var state = load();
  state.done = state.done || {};
  state.notes = state.notes || {};
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- theme ---------- */
  function applyTheme() {
    if (state.theme === "dark" || state.theme === "light") {
      document.documentElement.setAttribute("data-theme", state.theme);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }
  function currentIsDark() {
    if (state.theme === "dark") return true;
    if (state.theme === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function toggleTheme() {
    state.theme = currentIsDark() ? "light" : "dark";
    save(); applyTheme(); render();
  }
  applyTheme();

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function bySel(sel, root) { return (root || document).querySelector(sel); }
  function sessionById(id) { for (var i = 0; i < SESSIONS.length; i++) if (SESSIONS[i].id === id) return SESSIONS[i]; return null; }
  function doneCount() { var n = 0; for (var i = 0; i < SESSIONS.length; i++) if (state.done[SESSIONS[i].id]) n++; return n; }
  function firstIncomplete() { for (var i = 0; i < SESSIONS.length; i++) if (!state.done[SESSIONS[i].id]) return SESSIONS[i]; return SESSIONS[SESSIONS.length - 1]; }
  function continueTarget() {
    if (state.last && sessionById(state.last) && !state.done[state.last]) return sessionById(state.last);
    return firstIncomplete();
  }

  var themeGlyph = function () { return currentIsDark() ? "☼" : "☾"; }; // sun / moon

  /* ---------- completion webhook (fire-and-forget, retry-on-load) ---------- */
  function loadQueue() {
    try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveQueue(q) {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {}
  }
  function sendPing(payload) {
    if (!WEBHOOK_URL) return Promise.reject(new Error("no webhook configured"));
    return fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) { if (!r.ok) throw new Error("bad status " + r.status); return r; });
  }
  function notifySessionComplete(sid) {
    var s = sessionById(sid);
    var payload = {
      event: "session_complete",
      sessionId: sid,
      sessionNumber: s ? s.n : null,
      title: s ? s.title : null,
      ref: s ? s.ref : null,
      completedAt: new Date().toISOString()
    };
    sendPing(payload).catch(function () {
      var q = loadQueue();
      q.push(payload);
      saveQueue(q);
    });
  }
  function flushQueue() {
    var q = loadQueue();
    if (!q.length) return;
    var remaining = [];
    var chain = Promise.resolve();
    q.forEach(function (payload) {
      chain = chain.then(function () {
        return sendPing(payload).catch(function () { remaining.push(payload); });
      });
    });
    chain.then(function () { saveQueue(remaining); });
  }
  if (typeof fetch === "function") {
    // best-effort retry of anything that failed to send last time (e.g. offline)
    setTimeout(flushQueue, 1200);
    window.addEventListener("online", flushQueue);
  }

  /* ---------- cross-device progress sync ---------- */
  function pushProgress(sid) {
    if (!SYNC_SAVE_URL) return;
    fetch(SYNC_SAVE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: sid, done: !!state.done[sid], note: state.notes[sid] || "" })
    }).catch(function () {});
  }
  function syncProgress() {
    if (!SYNC_LOAD_URL) return;
    fetch(SYNC_LOAD_URL).then(function (r) { return r.ok ? r.json() : null; }).then(function (rows) {
      if (!rows) return;
      var list = Array.isArray(rows) ? rows : [rows];
      var remote = {};
      list.forEach(function (row) {
        if (row && row.sessionId) remote[row.sessionId] = row;
      });

      // 1. pull: fill any gaps in local state from the server
      var changed = false;
      list.forEach(function (row) {
        if (!row || !row.sessionId || !sessionById(row.sessionId)) return;
        if (row.done && !state.done[row.sessionId]) { state.done[row.sessionId] = true; changed = true; }
        if (row.note && !state.notes[row.sessionId]) { state.notes[row.sessionId] = row.note; changed = true; }
      });
      if (changed) { save(); render(); }

      // 2. push: upload local progress the server doesn't have yet
      SESSIONS.forEach(function (s) {
        var localDone = !!state.done[s.id];
        var localNote = state.notes[s.id] || "";
        if (!localDone && !localNote) return;
        var r = remote[s.id];
        var serverDone = r ? !!r.done : false;
        var serverNote = r ? (r.note || "") : "";
        if (localDone !== serverDone || localNote !== serverNote) {
          if ((localDone && !serverDone) || (localNote && localNote !== serverNote)) {
            pushProgress(s.id);
          }
        }
      });
    }).catch(function () {});
  }
  setTimeout(syncProgress, 300);

  /* ---------- toast ---------- */
  var toastEl, toastTimer;
  function toast(msg) {
    if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
  }

  /* ---------- top bar ---------- */
  function topbar(inSession) {
    return '' +
      '<div class="topbar">' +
        '<button class="brand" data-nav="#/" aria-label="Home">' +
          '<span class="mark" aria-hidden="true">✝</span>' +
          '<span>' + esc(DATA.season.book) + '</span>' +
        '</button>' +
        '<button class="iconbtn" data-act="theme" aria-label="Toggle light or dark theme">' + themeGlyph() + '</button>' +
      '</div>';
  }

  /* ---------- home ---------- */
  function renderHome() {
    var total = SESSIONS.length, done = doneCount();
    var pct = Math.round((done / total) * 100);
    var cont = continueTarget();
    var contDone = done === total;
    var labelTop = contDone ? "Revisit" : (done === 0 ? "Begin with" : "Continue with");

    var list = SESSIONS.map(function (s) {
      var isDone = !!state.done[s.id];
      var isCurrent = !contDone && s.id === cont.id;
      var right = isDone
        ? '<span class="chev" aria-hidden="true">✓</span>'
        : (isCurrent ? '<span class="badge">Next</span>' : '<span class="chev" aria-hidden="true">›</span>');
      return '' +
        '<li><button class="session-item' + (isDone ? ' done' : '') + (isCurrent ? ' current' : '') + '" data-open="' + s.id + '">' +
          '<span class="num">' + s.n + '</span>' +
          '<span class="st"><span class="t">' + esc(s.title) + '</span>' +
          '<span class="r">' + esc(s.ref) + '</span></span>' +
          right +
        '</button></li>';
    }).join("");

    var html = '' +
      topbar(false) +
      '<div class="wrap view">' +
        '<header class="hero">' +
          '<span class="eyebrow">' + esc(DATA.season.eyebrow) + '</span>' +
          '<h1>' + esc(DATA.season.book) + '</h1>' +
          '<p class="tagline">' + esc(DATA.season.tagline) + '</p>' +
          '<div class="rule-orn"><span class="dot" aria-hidden="true">✦</span></div>' +
        '</header>' +

        '<section class="progress-card">' +
          '<div class="progress-head">' +
            '<span class="count"><b>' + done + '</b> of ' + total + ' sessions</span>' +
            '<span class="label">' + (contDone ? "Complete" : (pct + "% through Mark")) + '</span>' +
          '</div>' +
          '<div class="meter"><span style="width:' + pct + '%"></span></div>' +
          '<button class="btn-primary" data-open="' + cont.id + '">' +
            '<span>' + (contDone ? "Revisit the Gospel" : "Continue where we left off") + '</span>' +
            '<span class="sub">· ' + esc(cont.title) + '</span>' +
          '</button>' +
        '</section>' +

        '<p class="label" style="margin-top:2rem;">The eight sessions</p>' +
        '<ul class="sessions">' + list + '</ul>' +

        '<p class="home-note">Two sittings a week, about thirty minutes each &mdash; together. ' +
          'Miss a week and nothing breaks; just pick up here.</p>' +

        '<div class="home-foot">' +
          '<button class="ghost" data-act="export">⤓ Back up progress</button>' +
          '<button class="ghost" data-act="import">⤒ Restore from file</button>' +
        '</div>' +
      '</div>';

    document.getElementById("app").innerHTML = html;
  }

  /* ---------- session ---------- */
  function scriptureHtml(s) {
    var out = "";
    for (var ci = 0; ci < s.chapters.length; ci++) {
      var ch = s.chapters[ci];
      out += '<div class="chap-label">Chapter ' + ch.n + '</div>';
      var body = "";
      for (var vi = 0; vi < ch.verses.length; vi++) {
        var v = ch.verses[vi];
        var isFirst = (ci === 0 && vi === 0);
        if (isFirst) {
          body += dropcapText(v.t) + " ";
        } else {
          body += '<span class="vnum">' + v.v + '</span>' + esc(v.t) + " ";
        }
      }
      out += '<p>' + body.trim() + '</p>';
    }
    return out;
  }
  function dropcapText(text) {
    var m = String(text).match(/^(\s*[^A-Za-z]*)([A-Za-z])([\s\S]*)$/);
    if (!m) return esc(text);
    return esc(m[1]) + '<span class="dropcap-letter">' + esc(m[2]) + '</span>' + esc(m[3]);
  }

  function renderSession(s) {
    state.last = s.id; save();

    var notes = s.notes.map(function (n) {
      return '<div class="note"><h4>' + esc(n.h) + '</h4><p>' + esc(n.t) + '</p></div>';
    }).join("");

    var qas = s.questions.map(function (q) {
      return '<details class="qa"><summary><span class="tw" aria-hidden="true">+</span><span>' + esc(q.q) + '</span></summary>' +
        '<div class="ans">' + esc(q.a) + '</div></details>';
    }).join("");

    var d = s.discuss;
    var discuss = '' +
      '<div class="dcard observe"><div class="tag"><span class="dt"></span>Observe &middot; head</div><p>' + esc(d.observe) + '</p></div>' +
      '<div class="dcard meaning"><div class="tag"><span class="dt"></span>Meaning &middot; heart</div><p>' + esc(d.meaning) + '</p></div>' +
      '<div class="dcard apply"><div class="tag"><span class="dt"></span>Apply &middot; hands</div><p>' + esc(d.apply) + '</p></div>';

    var idx = SESSIONS.indexOf(s);
    var prev = idx > 0 ? SESSIONS[idx - 1] : null;
    var next = idx < SESSIONS.length - 1 ? SESSIONS[idx + 1] : null;
    var isDone = !!state.done[s.id];
    var savedNote = state.notes[s.id] || "";

    var html = '' +
      topbar(true) +
      '<div class="wrap view">' +
        '<header class="s-head">' +
          '<span class="eyebrow">Session ' + s.n + ' of ' + SESSIONS.length + '</span>' +
          '<h1>' + esc(s.title) + '</h1>' +
          '<div class="ref">' + esc(s.ref) +
            ' <a class="niv-link" href="' + esc(s.nivUrl) + '" target="_blank" rel="noopener">Open in NIV ↗</a>' +
          '</div>' +
        '</header>' +

        '<section class="section"><div class="section-rule"><span class="label">Where we are</span></div>' +
          '<p class="context">' + esc(s.context) + '</p></section>' +

        '<section class="section"><div class="section-rule"><span class="label">The reading &middot; ' + esc(DATA.web) + '</span></div>' +
          '<div class="scripture">' + scriptureHtml(s) + '</div></section>' +

        '<section class="section"><div class="section-rule"><span class="label">A little background</span></div>' +
          '<div class="notes-list">' + notes + '</div></section>' +

        '<section class="section"><div class="section-rule"><span class="label">You might be wondering</span></div>' +
          qas + '</section>' +

        '<section class="section"><div class="section-rule"><span class="label">Talk it through</span></div>' +
          '<div class="discuss">' + discuss + '</div></section>' +

        '<section class="section"><div class="section-rule"><span class="label">Ask your own question</span></div>' +
          '<div class="ask">' +
            '<p class="hint">Stuck on something? Type it below, tap copy, and paste it into the Claude app for a clear answer.</p>' +
            '<textarea id="askText" placeholder="e.g. What did people expect the Messiah to be like?"></textarea>' +
            '<div class="ask-row">' +
              '<button class="btn-verd" data-act="ask-copy" data-sid="' + s.id + '">⧉ Copy question for Claude</button>' +
              '<a class="open-claude" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude ↗</a>' +
            '</div>' +
          '</div></section>' +

        '<section class="section"><div class="section-rule"><span class="label">Pray together</span></div>' +
          '<div class="prayer"><p class="amen">' + esc(s.prayer) + '</p></div></section>' +

        '<section class="section pnotes"><div class="section-rule"><span class="label">Our notes</span></div>' +
          '<textarea id="pnote" placeholder="Anything you talked about, questions, prayers, things to remember…">' + esc(savedNote) + '</textarea>' +
          '<div class="saved" id="pnoteSaved"></div></section>' +

        '<div class="complete-row">' +
          '<button class="btn-complete' + (isDone ? ' is-done' : '') + '" data-act="toggle-done" data-sid="' + s.id + '">' +
            (isDone ? '✓ Session complete' : 'Mark this session complete') +
          '</button>' +
        '</div>' +

        '<nav class="pager">' +
          (prev
            ? '<button data-open="' + prev.id + '">‹ <span class="pl">' + esc(prev.title) + '</span></button>'
            : '<button disabled>‹ Start</button>') +
          (next
            ? '<button data-open="' + next.id + '"><span class="pl">' + esc(next.title) + '</span> ›</button>'
            : '<button data-nav="#/">Finish ›</button>') +
        '</nav>' +
      '</div>';

    document.getElementById("app").innerHTML = html;
    window.scrollTo(0, 0);

    // autosave personal notes
    var pn = document.getElementById("pnote");
    var savedLbl = document.getElementById("pnoteSaved");
    var t;
    if (pn) {
      pn.addEventListener("input", function () {
        clearTimeout(t);
        t = setTimeout(function () {
          state.notes[s.id] = pn.value; save();
          pushProgress(s.id);
          savedLbl.textContent = "Saved";
          setTimeout(function () { savedLbl.textContent = ""; }, 1400);
        }, 400);
      });
    }
  }

  /* ---------- ask copy ---------- */
  function copyAsk(sid) {
    var s = sessionById(sid);
    var q = (document.getElementById("askText") || {}).value || "";
    q = q.trim();
    if (!q) { toast("Type a question first."); var a = document.getElementById("askText"); if (a) a.focus(); return; }
    var prompt =
      "I'm doing a Bible study on the Gospel of Mark with my wife, reading " + s.ref + " (World English Bible). " +
      "Here's our question:\n\n\"" + q + "\"\n\n" +
      "Please explain it clearly and simply, with any helpful historical or cultural background, in a warm and accessible way.";
    copyText(prompt).then(function () {
      toast("Copied — paste it into the Claude app.");
    }, function () {
      toast("Couldn't copy automatically — select the text and copy.");
    });
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (res, rej) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand("copy"); document.body.removeChild(ta);
        ok ? res() : rej();
      } catch (e) { rej(e); }
    });
  }

  /* ---------- backup / restore ---------- */
  function exportData() {
    var payload = { app: "bible-study-companion", book: "Mark", version: 1, exported: new Date().toISOString(), state: state };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "bible-study-backup.json";
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    toast("Progress backed up.");
  }
  function importData() {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var obj = JSON.parse(r.result);
          var incoming = obj && obj.state ? obj.state : obj;
          if (!incoming || (typeof incoming.done !== "object" && typeof incoming.notes !== "object")) {
            toast("That doesn't look like a backup file."); return;
          }
          if (!confirm("Restore this backup? It will replace your current notes and progress on this device.")) return;
          state.done = incoming.done || {};
          state.notes = incoming.notes || {};
          if (incoming.last) state.last = incoming.last;
          if (incoming.theme) state.theme = incoming.theme;
          save(); applyTheme(); render();
          toast("Progress restored.");
        } catch (e) { toast("Couldn't read that file."); }
      };
      r.readAsText(f);
    });
    inp.click();
  }

  /* ---------- router ---------- */
  function render() {
    var h = location.hash || "#/";
    var m = h.match(/^#\/s\/(.+)$/);
    if (m) {
      var s = sessionById(m[1]);
      if (s) { renderSession(s); return; }
    }
    renderHome();
  }

  function openSession(id) {
    var s = sessionById(id); if (!s) return;
    state.last = id; save();
    location.hash = "#/s/" + id;
  }

  /* ---------- global events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-open],[data-nav],[data-act]");
    if (!t) return;
    if (t.hasAttribute("data-open")) { e.preventDefault(); openSession(t.getAttribute("data-open")); return; }
    if (t.hasAttribute("data-nav")) { e.preventDefault(); location.hash = t.getAttribute("data-nav"); return; }
    var act = t.getAttribute("data-act");
    if (act === "theme") { toggleTheme(); }
    else if (act === "export") { exportData(); }
    else if (act === "import") { importData(); }
    else if (act === "ask-copy") { copyAsk(t.getAttribute("data-sid")); }
    else if (act === "toggle-done") {
      var sid = t.getAttribute("data-sid");
      var nowDone;
      if (state.done[sid]) { delete state.done[sid]; nowDone = false; } else { state.done[sid] = true; nowDone = true; }
      save();
      pushProgress(sid);
      t.classList.toggle("is-done", nowDone);
      t.textContent = nowDone ? "✓ Session complete" : "Mark this session complete";
      if (nowDone) { toast("Nicely done. See you next time."); notifySessionComplete(sid); }
    }
  });

  window.addEventListener("hashchange", render);
  render();
})();

</script>
