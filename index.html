<title>The Gospel of Mark — Bible Study Companion</title>
<style>
/* ============================================================
   Bible Study Companion — "Stillness"
   Calm & minimal: air, quiet type, one muted sage accent.
   ============================================================ */

:root {
  --font-body: Georgia, "Iowan Old Style", Charter, "Palatino Linotype", ui-serif, serif;
  --font-display: Georgia, "Iowan Old Style", Charter, "Palatino Linotype", ui-serif, serif;
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* light — soft daylight */
  --paper:      #FBFAF6;
  --surface:    #ffffff;
  --surface-2:  #f4f3ee;
  --ink:        #2c2c2e;
  --ink-mid:    #5f5f63;
  --muted:      #9b9b9f;
  --line:       #eceae3;
  --line-2:     #e3e1d8;
  --accent:     #4d7267;
  --accent-2:   #3f6156;
  --on-accent:  #ffffff;
  --danger:     #9a3b2e;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #16171a;
    --surface:    #1d1f22;
    --surface-2:  #232528;
    --ink:        #e7e5df;
    --ink-mid:    #a9a8a2;
    --muted:      #7f7f84;
    --line:       #292b2f;
    --line-2:     #31343a;
    --accent:     #86b3a4;
    --accent-2:   #99c2b4;
    --on-accent:  #12201b;
    --danger:     #e08a7a;
    color-scheme: dark;
  }
}

:root[data-theme="light"] {
  --paper:#FBFAF6; --surface:#ffffff; --surface-2:#f4f3ee;
  --ink:#2c2c2e; --ink-mid:#5f5f63; --muted:#9b9b9f; --line:#eceae3; --line-2:#e3e1d8;
  --accent:#4d7267; --accent-2:#3f6156; --on-accent:#ffffff; --danger:#9a3b2e; color-scheme: light;
}
:root[data-theme="dark"] {
  --paper:#16171a; --surface:#1d1f22; --surface-2:#232528;
  --ink:#e7e5df; --ink-mid:#a9a8a2; --muted:#7f7f84; --line:#292b2f; --line-2:#31343a;
  --accent:#86b3a4; --accent-2:#99c2b4; --on-accent:#12201b; --danger:#e08a7a; color-scheme: dark;
}

* { box-sizing: border-box; }

.bsc {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  min-height: 100dvh;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.wrap { max-width: 38rem; margin: 0 auto; padding: 0 1.5rem 6rem; }

/* ---------- utility type ---------- */
.eyebrow, .label {
  font-family: var(--font-ui);
  text-transform: uppercase;
  letter-spacing: .16em;
  font-size: .68rem;
  font-weight: 600;
  color: var(--muted);
}
.eyebrow { color: var(--accent-2); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: .75rem;
  padding: .85rem 1.5rem;
  background: color-mix(in oklab, var(--paper) 82%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar .brand {
  font-family: var(--font-display); font-size: .98rem; font-weight: 600;
  margin-right: auto; display: flex; align-items: center; gap: .6rem;
  background: transparent; border: 0; color: inherit; cursor: pointer; padding: 0;
}
.brand .mark {
  width: 1.5rem; height: 1.5rem; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: .72rem;
  border: 1px solid var(--accent); color: var(--accent-2); background: transparent;
}
.iconbtn {
  font-family: var(--font-ui); font-size: .95rem; color: var(--ink-mid);
  background: transparent; border: 1px solid var(--line-2); border-radius: 50%;
  width: 2rem; height: 2rem; cursor: pointer; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
}
.iconbtn:hover { border-color: var(--accent); color: var(--accent-2); }

/* ---------- home ---------- */
.hero { padding: 3.4rem 0 1rem; }
.hero .eyebrow { display: block; margin-bottom: 1rem; }
.hero h1 { font-size: clamp(2rem, 6.5vw, 2.7rem); font-weight: 600; }
.hero .tagline { color: var(--ink-mid); font-size: 1.08rem; margin: 1.1rem 0 0; max-width: 32rem; }
.rule-orn { margin: 2.2rem 0 0; height: 1px; background: var(--line-2); width: 2.5rem; }
.rule-orn .dot { display: none; }

.progress-card {
  margin-top: 2.4rem; padding: 0; display: flex; flex-direction: column; gap: 1.1rem;
}
.progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
.progress-head .count { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink-mid); }
.progress-head .count b { color: var(--ink); font-weight: 600; }
.meter { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .55s cubic-bezier(.2,.8,.2,1); }

.btn-primary {
  font-family: var(--font-ui); font-weight: 600; font-size: .92rem;
  border: none; cursor: pointer; border-radius: .7rem; padding: .95rem 1.1rem;
  background: var(--accent); color: var(--on-accent); width: 100%;
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  flex-wrap: wrap; margin-top: .3rem;
}
.btn-primary:hover { background: var(--accent-2); }
.btn-primary .sub { font-weight: 500; opacity: .82; }

/* session list */
.sessions { list-style: none; margin: 1.4rem 0 0; padding: 0; }
.sessions li { border-top: 1px solid var(--line); }
.sessions li:last-child { border-bottom: 1px solid var(--line); }
.session-item {
  display: flex; align-items: center; gap: 1.1rem; width: 100%;
  background: transparent; border: 0; padding: 1.05rem .25rem; cursor: pointer;
  text-align: left; color: inherit; font-family: inherit;
}
.session-item:hover { background: color-mix(in oklab, var(--accent) 5%, transparent); }
.session-item .num {
  flex: none; width: 1.9rem; height: 1.9rem; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--font-ui); font-size: .82rem; font-weight: 600;
  border: 1px solid var(--line-2); color: var(--muted); background: transparent;
}
.session-item.done .num { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.session-item.current .num { border-color: var(--accent); color: var(--accent-2); }
.session-item .st { display: flex; flex-direction: column; gap: .12rem; min-width: 0; }
.session-item .st .t { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
.session-item .st .r { font-family: var(--font-ui); font-size: .74rem; letter-spacing: .03em; color: var(--muted); }
.session-item .chev { margin-left: auto; color: var(--muted); flex: none; font-size: 1.05rem; }
.session-item.done .chev { color: var(--accent); }
.session-item .badge {
  margin-left: auto; font-family: var(--font-ui); font-size: .62rem; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2);
}

.home-foot { margin-top: 2.6rem; display: flex; flex-wrap: wrap; gap: 1.4rem; }
.ghost {
  font-family: var(--font-ui); font-size: .8rem; font-weight: 500; color: var(--muted);
  background: transparent; border: 0; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: .4rem; border-bottom: 1px solid transparent;
}
.ghost:hover { color: var(--accent-2); border-bottom-color: var(--accent); }
.home-note { color: var(--muted); font-size: .9rem; margin-top: 2rem; font-family: var(--font-ui); line-height: 1.6; }

/* ---------- session view ---------- */
.s-head { padding: 2.6rem 0 .4rem; }
.s-head .eyebrow { display: block; margin-bottom: .7rem; }
.s-head h1 { font-size: clamp(1.85rem, 6vw, 2.4rem); font-weight: 600; }
.s-head .ref { font-family: var(--font-ui); color: var(--muted); font-size: .8rem; letter-spacing: .04em; margin-top: .7rem; display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
.niv-link {
  font-family: var(--font-ui); font-weight: 500; font-size: .78rem; letter-spacing: .01em;
  color: var(--accent-2); text-decoration: none; border-bottom: 1px solid var(--line-2);
  padding-bottom: 1px;
}
.niv-link:hover { border-bottom-color: var(--accent); }

.section { margin-top: 3rem; }
.section-rule { margin-bottom: 1.1rem; }
.section-rule .label { display: block; }

.context { color: var(--ink-mid); font-size: 1.1rem; }

/* scripture */
.scripture { font-size: 1.16rem; line-height: 1.85; }
.chap-label {
  font-family: var(--font-ui); text-transform: uppercase; letter-spacing: .16em;
  font-size: .64rem; font-weight: 600; color: var(--muted); margin: 2rem 0 .7rem;
}
.chap-label:first-child { margin-top: 0; }
.scripture p { margin: 0; }
.vnum {
  font-family: var(--font-ui); font-size: .58em; font-weight: 600; color: var(--accent);
  vertical-align: super; line-height: 0; margin: 0 .2em 0 .12em; letter-spacing: 0;
  font-feature-settings: "tnum"; user-select: none; opacity: .85;
}
.scripture .dropcap-letter { color: inherit; }

/* study notes — airy, borderless, hairline-separated */
.notes-list { display: flex; flex-direction: column; }
.note { padding: 1.1rem 0; border-top: 1px solid var(--line); }
.note:first-child { border-top: 0; padding-top: 0; }
.note h4 { font-size: 1.02rem; font-weight: 600; margin: 0 0 .3rem; }
.note p { margin: 0; color: var(--ink-mid); font-size: 1rem; }

/* common questions — hairline accordion */
.qa { border-bottom: 1px solid var(--line); }
.qa:first-of-type { border-top: 1px solid var(--line); }
.qa summary {
  cursor: pointer; list-style: none; padding: 1rem 0; font-family: var(--font-display);
  font-size: 1.05rem; font-weight: 600; display: flex; align-items: flex-start; gap: .8rem; color: var(--ink);
}
.qa summary::-webkit-details-marker { display: none; }
.qa summary .tw { flex: none; width: 1.1rem; color: var(--accent); transition: transform .2s; font-family: var(--font-ui); font-weight: 400; font-size: 1.1rem; line-height: 1.5; }
.qa[open] summary .tw { transform: rotate(45deg); }
.qa .ans { padding: 0 0 1.1rem 1.9rem; color: var(--ink-mid); font-size: 1rem; }

/* discussion — quiet, single accent */
.discuss { display: flex; flex-direction: column; gap: 1.6rem; }
.dcard { background: transparent; border: 0; border-left: 2px solid var(--accent); padding: .1rem 0 .1rem 1.1rem; }
.dcard .tag {
  font-family: var(--font-ui); text-transform: uppercase; letter-spacing: .13em; font-size: .62rem;
  font-weight: 600; margin-bottom: .45rem; display: flex; align-items: center; gap: .45rem; color: var(--muted);
}
.dcard.observe .tag, .dcard.meaning .tag, .dcard.apply .tag { color: var(--accent-2); }
.dcard .tag .dt { display: none; }
.dcard p { margin: 0; font-size: 1.1rem; color: var(--ink); line-height: 1.6; }

/* prayer — a quiet centered whisper */
.prayer { text-align: center; padding: 1.4rem 0; }
.prayer .amen { font-family: var(--font-display); font-size: 1.18rem; font-style: italic; line-height: 1.7; color: var(--ink-mid); max-width: 30rem; margin: 0 auto; }

/* ask box */
.ask { padding: 0; }
.ask p.hint { margin: 0 0 .8rem; font-size: .92rem; color: var(--ink-mid); font-family: var(--font-ui); line-height: 1.6; }
.ask textarea, .pnotes textarea {
  width: 100%; resize: vertical; font-family: var(--font-body); font-size: 1.02rem;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: .6rem;
  padding: .8rem .9rem; line-height: 1.6;
}
.ask textarea { min-height: 4.5rem; }
.ask textarea:focus, .pnotes textarea:focus { border-color: var(--accent); outline: none; }
.ask .ask-row { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: .8rem; align-items: center; }
.btn-verd {
  font-family: var(--font-ui); font-weight: 600; font-size: .84rem; cursor: pointer;
  border: 1px solid var(--accent); color: var(--accent-2); background: transparent;
  border-radius: .6rem; padding: .55rem .9rem; display: inline-flex; align-items: center; gap: .4rem;
}
.btn-verd:hover { background: color-mix(in oklab, var(--accent) 10%, transparent); }
.ask .open-claude { font-family: var(--font-ui); font-size: .78rem; color: var(--muted); text-decoration: none; margin-left: auto; }
.ask .open-claude:hover { color: var(--accent-2); }

/* personal notes */
.pnotes textarea { min-height: 6rem; }
.pnotes .saved { font-family: var(--font-ui); font-size: .72rem; color: var(--accent-2); margin-top: .45rem; height: 1rem; }

/* complete + nav */
.complete-row { margin-top: 3.2rem; }
.btn-complete {
  width: 100%; font-family: var(--font-ui); font-weight: 600; font-size: .92rem; cursor: pointer;
  border-radius: .7rem; padding: .95rem; border: 1px solid var(--accent);
  background: transparent; color: var(--accent-2); display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
}
.btn-complete:hover { background: color-mix(in oklab, var(--accent) 8%, transparent); }
.btn-complete.is-done { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.6rem; padding-top: 1.6rem; border-top: 1px solid var(--line); }
.pager button {
  font-family: var(--font-ui); font-size: .82rem; font-weight: 500; color: var(--ink-mid);
  background: transparent; border: 0; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: .4rem; max-width: 48%;
}
.pager button:hover:not(:disabled) { color: var(--accent-2); }
.pager button:disabled { opacity: .35; cursor: default; }
.pager button .pl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 1.6rem; transform: translateX(-50%) translateY(1.5rem);
  background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: .85rem; font-weight: 500;
  padding: .7rem 1.1rem; border-radius: .6rem; box-shadow: 0 8px 30px -12px rgba(0,0,0,.4);
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* view transitions */
.view { animation: fade .4s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* accessibility */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

@media (max-width: 420px) {
  .wrap { padding-left: 1.2rem; padding-right: 1.2rem; }
  .scripture { font-size: 1.1rem; }
}

oved Son, in whom I am well pleased.”"},{"v":12,"t":"Immediately the Spirit drove him out into the wilderness."},{"v":13,"t":"He was there in the wilderness forty days tempted by Satan. He was with the wild animals; and the angels were serving him."},{"v":14,"t":"Now after John was taken into custody, Jesus came into Galilee, preaching the Good News of God’s Kingdom,"},{"v":15,"t":"and saying, “The time is fulfilled, and God’s Kingdom is at hand! Repent, and believe in the Good News.”"},{"v":16,"t":"Passing along by the sea of Galilee, he saw Simon and Andrew the brother of Simon casting a net into the sea, for they were fishermen."},{"v":17,"t":"Jesus said to them, “Come after me, and I will make you into fishers for men.”"},{"v":18,"t":"Immediately they left their nets, and followed him."},{"v":19,"t":"Going on a little further from there, he saw James the son of Zebedee, and John, his brother, who were also in the boat mending the nets."},{"v":20,"t":"Immediately he called them, and they left their father, Zebedee, in the boat with the hired servants, and went after him."},{"v":21,"t":"They went into Capernaum, and immediately on the Sabbath day he entered into the synagogue and taught."},{"v":22,"t":"They were astonished at his teaching, for he taught them as having authority, and not as the scribes."},{"v":23,"t":"Immediately there was in their synagogue a man with an unclean spirit, and he cried out,"},{"v":24,"t":"saying, “Ha! What do we have to do with you, Jesus, you Nazarene? Have you come to destroy us? I know you who you are: the Holy One of God!”"},{"v":25,"t":"Jesus rebuked him, saying, “Be quiet, and come out of him!”"},{"v":26,"t":"The unclean spirit, convulsing him and crying with a loud voice, came out of him."},{"v":27,"t":"They were all amazed, so that they questioned among themselves, saying, “What is this? A new teaching? For with authority he commands even the unclean spirits, and they obey him!”"},{"v":28,"t":"The report of him went out immediately everywhere into all the region of Galilee and its surrounding area."},{"v":29,"t":"Immediately, when they had come out of the synagogue, they came into the house of Simon and Andrew, with James and John."},{"v":30,"t":"Now Simon’s wife’s mother lay sick with a fever, and immediately they told him about her."},{"v":31,"t":"He came and took her by the hand, and raised her up. The fever left her, and she served them."},{"v":32,"t":"At evening, when the sun had set, they brought to him all who were sick, and those who were possessed by demons."},{"v":33,"t":"All the city was gathered together at the door."},{"v":34,"t":"He healed many who were sick with various diseases, and cast out many demons. He didn’t allow the demons to speak, because they knew him."},{"v":35,"t":"Early in the morning, while it was still dark, he rose up and went out, and departed into a deserted place, and prayed there."},{"v":36,"t":"Simon and those who were with him followed after him;"},{"v":37,"t":"and they found him, and told him, “Everyone is looking for you.”"},{"v":38,"t":"He said to them, “Let’s go elsewhere into the next towns, that I may preach there also, because I came out for this reason.”"},{"v":39,"t":"He went into their synagogues throughout all Galilee, preaching and casting out demons."},{"v":40,"t":"A leper came to him, begging him, kneeling down to him, and saying to him, “If you want to, you can make me clean.”"},{"v":41,"t":"Being moved with compassion, he stretched out his hand, and touched him, and said to him, “I want to. Be made clean.”"},{"v":42,"t":"When he had said this, immediately the leprosy departed from him, and he was made clean."},{"v":43,"t":"He strictly warned him, and immediately sent him out,"},{"v":44,"t":"and said to him, “See you say nothing to anybody, but go show yourself to the priest, and offer for your cleansing the things which Moses commanded, for a testimony to them.”"},{"v":45,"t":"But he went out, and began to proclaim it much, and to spread about the matter, so that Jesus could no more openly enter into a city, but was outside in desert places: and they came to him from everywhere."}]},{"n":2,"verses":[{"v":1,"t":"When he entered again into Capernaum after some days, it was heard that he was in the house."},{"v":2,"t":"Immediately many were gathered together, so that there was no more room, not even around the door; and he spoke the word to them."},{"v":3,"t":"Four people came, carrying a paralytic to him."},{"v":4,"t":"When they could not come near to him for the crowd, they removed the roof where he was. When they had broken it up, they let down the mat that the paralytic was lying on."},{"v":5,"t":"Jesus, seeing their faith, said to the paralytic, “Son, your sins are forgiven you.”"},{"v":6,"t":"But there were some of the scribes sitting there, and reasoning in their hearts,"},{"v":7,"t":"“Why does this man speak blasphemies like that? Who can forgive sins but God alone?”"},{"v":8,"t":"Immediately Jesus, perceiving in his spirit that they so reasoned within themselves, said to them, “Why do you reason these things in your hearts?"},{"v":9,"t":"Which is easier, to tell the paralytic, ‘Your sins are forgiven;’ or to say, ‘Arise, and take up your bed, and walk?’"},{"v":10,"t":"But that you may know that the Son of Man has authority on earth to forgive sins”—he said to the paralytic—"},{"v":11,"t":"“I tell you, arise, take up your mat, and go to your house.”"},{"v":12,"t":"He arose, and immediately took up the mat, and went out in front of them all; so that they were all amazed, and glorified God, saying, “We never saw anything like this!”"},{"v":13,"t":"He went out again by the seaside. All the multitude came to him, and he taught them."},{"v":14,"t":"As he passed by, he saw Levi, the son of Alphaeus, sitting at the tax office, and he said to him, “Follow me.” And he arose and followed him."},{"v":15,"t":"He was reclining at the table in his house, and many tax collectors and sinners sat down with Jesus and his disciples, for there were many, and they followed him."},{"v":16,"t":"The scribes and the Pharisees, when they saw that he was eating with the sinners and tax collectors, said to his disciples, “Why is it that he eats and drinks with tax collectors and sinners?”"},{"v":17,"t":"When Jesus heard it, he said to them, “Those who are healthy have no need for a physician, but those who are sick. I came not to call the righteous, but sinners to repentance.”"},{"v":18,"t":"John’s disciples and the Pharisees were fasting, and they came and asked him, “Why do John’s disciples and the disciples of the Pharisees fast, but your disciples don’t fast?”"},{"v":19,"t":"Jesus said to them, “Can the groomsmen fast while the bridegroom is with them? As long as they have the bridegroom with them, they can’t fast."},{"v":20,"t":"But the days will come when the bridegroom will be taken away from them, and then will they fast in that day."},{"v":21,"t":"No one sews a piece of unshrunk cloth on an old garment, or else the patch shrinks and the new tears away from the old, and a worse hole is made."},{"v":22,"t":"No one puts new wine into old wineskins, or else the new wine will burst the skins, and the wine pours out, and the skins will be destroyed; but they put new wine into fresh wineskins.”"},{"v":23,"t":"He was going on the Sabbath day through the grain fields, and his disciples began, as they went, to pluck the ears of grain."},{"v":24,"t":"The Pharisees said to him, “Behold, why do they do that which is not lawful on the Sabbath day?”"},{"v":25,"t":"He said to them, “Did you never read what David did, when he had need, and was hungry—he, and those who were with him?"},{"v":26,"t":"How he entered into God’s house at the time of Abiathar the high priest, and ate the show bread, which is not lawful to eat except for the priests, and gave also to those who were with him?”"},{"v":27,"t":"He said to them, “The Sabbath was made for man, not man for the Sabbath."},{"v":28,"t":"Therefore the Son of Man is lord even of the Sabbath.”"}]}],"context":"Mark opens at a run — no birth story, straight to John the Baptizer, Jesus’ baptism and wilderness testing, then the launch of his ministry: calling fishermen, freeing the oppressed, healing crowds, and, almost at once, colliding with the religious authorities.","notes":[{"h":"“Good News” (Gospel)","t":"The word (Greek euangelion) meant a royal announcement — like a herald proclaiming a victory or a new king. Mark is calling Jesus’ arrival breaking news, not a moral lesson."},{"h":"Watch for “immediately”","t":"Mark’s signature word (Greek euthys) appears around forty times and gives the whole Gospel its breathless, urgent pace. Notice how often the action just keeps moving."},{"h":"“Son of Man”","t":"Jesus’ favourite title for himself (2:10, 2:28). It comes from Daniel 7 — a heavenly figure given lasting authority by God. It sounds humble but quietly claims a great deal."},{"h":"The Kingdom of God (1:15)","t":"Not mainly a place, but God stepping in to take charge. “Repent” means to turn around and change direction — not merely to feel sorry."},{"h":"Authority to forgive sins (2:1–12)","t":"Only God could forgive sins — so when Jesus forgives the paralysed man, the scribes are scandalised. Jesus backs the invisible claim (forgiveness) with a visible one (healing)."},{"h":"Eating with “sinners” (2:15–17)","t":"Tax collectors were seen as traitors working for Rome. Sharing a table meant acceptance — so Jesus’ meals were a scandal and a statement: “I came to call sinners.”"}],"questions":[{"q":"Why is there no Christmas story in Mark?","a":"Mark simply isn’t interested in Jesus’ origins here — he wants you to meet the adult Jesus in action, fast. He drops you straight into the work."},{"q":"Why are the religious leaders already angry by chapter 2?","a":"Jesus claims authority they believed belonged to God alone — to forgive sins, to reinterpret the Sabbath. The conflict that eventually leads to the cross is set in motion this early."},{"q":"Why does Jesus tell people and demons to keep quiet (1:34, 1:44)?","a":"This runs all through Mark (scholars call it the “messianic secret”). Jesus seems to want to control how his identity is understood — he doesn’t want to be mistaken for a political or military messiah before the cross defines what kind of king he is."}],"discuss":{"observe":"Mark gives Jesus no gentle introduction. What’s your very first impression of him from these two chapters — and which single scene grabbed you most?","meaning":"Jesus’ first recorded words are “repent and believe the Good News” (1:15). What does it mean that following him starts with turning around?","apply":"Jesus called ordinary fishermen mid‑workday, and they left their nets “immediately.” Is there anything he might be nudging the two of us to drop or reorder right now?"},"prayer":"Jesus, you stepped into ordinary life and called ordinary people. As we begin, give us ears to hear you and courage to follow. Help us turn toward you — together. Amen."},{"id":"s2","n":2,"title":"Seeds and Storms","subtitle":"Mark 3–4","ref":"Mark 3–4","nivUrl":"https://www.biblegateway.com/passage/?search=Mark%203-4&version=NIV","chapters":[{"n":3,"verses":[{"v":1,"t":"He entered again into the synagogue, and there was a man there who had his hand withered."},{"v":2,"t":"They watched him, whether he would heal him on the Sabbath day, that they might accuse him."},{"v":3,"t":"He said to the man who had his hand withered, “Stand up.”"},{"v":4,"t":"He said to them, “Is it lawful on the Sabbath day to do good, or to do harm? To save a life, or to kill?” But they were silent."},{"v":5,"t":"When he had looked around at them with anger, being grieved at the hardening of their hearts, he said to the man, “Stretch out your hand.” He stretched it out, and his hand was restored as healthy as the other."},{"v":6,"t":"The Pharisees went out, and immediately conspired with the Herodians against him, how they might destroy him."},{"v":7,"t":"Jesus withdrew to the sea with his disciples, and a great multitude followed him from Galilee, from Judea,"},{"v":8,"t":"from Jerusalem, from Idumaea, beyond the Jordan, and those from around Tyre and Sidon. A great multitude, hearing what great things he did, came to him."},{"v":9,"t":"He spoke to his disciples that a little boat should stay near him because of the crowd, so that they wouldn’t press on him."},{"v":10,"t":"For he had healed many, so that as many as had diseases pressed on him that they might touch him."},{"v":11,"t":"The unclean spirits, whenever they saw him, fell down before him, and cried, “You are the Son of God!”"},{"v":12,"t":"He sternly warned them that they should not make him known."},{"v":13,"t":"He went up into the mountain, and called to himself those whom he wanted, and they went to him."},{"v":14,"t":"He appointed twelve, that they might be with him, and that he might send them out to preach,"},{"v":15,"t":"and to have authority to heal sicknesses and to cast out demons:"},{"v":16,"t":"Simon (to whom he gave the name Peter);"},{"v":17,"t":"James the son of Zebedee; and John, the brother of James, (whom he called Boanerges, which means, Sons of Thunder);"},{"v":18,"t":"Andrew; Philip; Bartholomew; Matthew; Thomas; James, the son of Alphaeus; Thaddaeus; Simon the Zealot;"},{"v":19,"t":"and Judas Iscariot, who also betrayed him. Then he came into a house."},{"v":20,"t":"The multitude came together again, so that they could not so much as eat bread."},{"v":21,"t":"When his friends heard it, they went out to seize him: for they said, “He is insane.”"},{"v":22,"t":"The scribes who came down from Jerusalem said, “He has Beelzebul,” and, “By the prince of the demons he casts out the demons.”"},{"v":23,"t":"He summoned them, and said to them in parables, “How can Satan cast out Satan?"},{"v":24,"t":"If a kingdom is divided against itself, that kingdom cannot stand."},{"v":25,"t":"If a house is divided against itself, that house cannot stand."},{"v":26,"t":"If Satan has risen up against himself, and is divided, he can’t stand, but has an end."},{"v":27,"t":"But no one can enter into the house of the strong man to plunder, unless he first binds the strong man; and then he will plunder his house."},{"v":28,"t":"Most certainly I tell you, all sins of the descendants of man will be forgiven, including their blasphemies with which they may blaspheme;"},{"v":29,"t":"but whoever may blaspheme against the Holy Spirit never has forgiveness, but is subject to eternal condemnation.”"},{"v":30,"t":"—because they said, “He has an unclean spirit.”"},{"v":31,"t":"His mother and his brothers came, and standing outside, they sent to him, calling him."},{"v":32,"t":"A multitude was sitting around him, and they told him, “Behold, your mother, your brothers, and your sisters are outside looking for you.”"},{"v":33,"t":"He answered them, “Who are my mother and my brothers?”"},{"v":34,"t":"Looking around at those who sat around him, he said, “Behold, my mother and my brothers!"},{"v":35,"t":"For whoever does the will of God, the same is my brother, and my sister, and mother.”"}]},{"n":4,"verses":[{"v":1,"t":"Again he began to teach by the seaside. A great multitude was gathered to him, so that he entered into a boat in the sea, and sat down. All the multitude were on the land by the sea."},{"v":2,"t":"He taught them many things in parables, and told them in his teaching,"},{"v":3,"t":"“Listen! Behold, the farmer went out to sow,"},{"v":4,"t":"and as he sowed, some seed fell by the road, and the birds came and devoured it."},{"v":5,"t":"Others fell on the rocky ground, where it had little soil, and immediately it sprang up, because it had no depth of soil."},{"v":6,"t":"When the sun had risen, it was scorched; and because it had no root, it withered away."},{"v":7,"t":"Others fell among the thorns, and the thorns grew up, and choked it, and it yielded no fruit."},{"v":8,"t":"Others fell into the good ground, and yielded fruit, growing up and increasing. Some produced thirty times, some sixty times, and some one hundred times as much.”"},{"v":9,"t":"He said, “Whoever has ears to hear, let him hear.”"},{"v":10,"t":"When he was alone, those who were around him with the twelve asked him about the parables."},{"v":11,"t":"He said to them, “To you is given the mystery of God’s Kingdom, but to those who are outside, all things are done in parables,"},{"v":12,"t":"that ‘seeing they may see, and not perceive; and hearing they may hear, and not understand; lest perhaps they should turn again, and their sins should be forgiven them.’”"},{"v":13,"t":"He said to them, “Don’t you understand this parable? How will you understand all of the parables?"},{"v":14,"t":"The farmer sows the word."},{"v":15,"t":"The ones by the road are the ones where the word is sown; and when they have heard, immediately Satan comes, and takes away the word which has been sown in them."},{"v":16,"t":"These in the same way are those who are sown on the rocky places, who, when they have heard the word, immediately receive it with joy."},{"v":17,"t":"They have no root in themselves, but are short-lived. When oppression or persecution arises because of the word, immediately they stumble."},{"v":18,"t":"Others are those who are sown among the thorns. These are those who have heard the word,"},{"v":19,"t":"and the cares of this age, and the deceitfulness of riches, and the lusts of other things entering in choke the word, and it becomes unfruitful."},{"v":20,"t":"Those which were sown on the good ground are those who hear the word, and accept it, and bear fruit, some thirty times, some sixty times, and some one hundred times.”"},{"v":21,"t":"He said to them, “Is the lamp brought to be put under a basket or under a bed? Isn’t it put on a stand?"},{"v":22,"t":"For there is nothing hidden, except that it should be made known; neither was anything made secret, but that it should come to light."},{"v":23,"t":"If any man has ears to hear, let him hear.”"},{"v":24,"t":"He said to them, “Take heed what you hear. With whatever measure you measure, it will be measured to you, and more will be given to you who hear."},{"v":25,"t":"For whoever has, to him will more be given, and he who doesn’t have, even that which he has will be taken away from him.”"},{"v":26,"t":"He said, “God’s Kingdom is as if a man should cast seed on the earth,"},{"v":27,"t":"and should sleep and rise night and day, and the seed should spring up and grow, though he doesn’t know how."},{"v":28,"t":"For the earth bears fruit: first the blade, then the ear, then the full grain in the ear."},{"v":29,"t":"But when the fruit is ripe, immediately he puts in the sickle, because the harvest has come.”"},{"v":30,"t":"He said, “How will we liken God’s Kingdom? Or with what parable will we illustrate it?"},{"v":31,"t":"It’s like a grain of mustard seed, which, when it is sown in the earth, though it is less than all the seeds that are on the earth,"},{"v":32,"t":"yet when it is sown, grows up, and becomes greater than all the herbs, and puts out great branches, so that the birds of the sky can lodge under its shadow.”"},{"v":33,"t":"With many such parables he spoke the word to them, as they were able to hear it."},{"v":34,"t":"Without a parable he didn’t speak to them; but privately to his own disciples he explained everything."},{"v":35,"t":"On that day, when evening had come, he said to them, “Let’s go over to the other side.”"},{"v":36,"t":"Leaving the multitude, they took him with them, even as he was, in the boat. Other small boats were also with him."},{"v":37,"t":"A big wind storm arose, and the waves beat into the boat, so much that the boat was already filled."},{"v":38,"t":"He himself was in the stern, asleep on the cushion, and they woke him up, and told him, “Teacher, don’t you care that we are dying?”"},{"v":39,"t":"He awoke, and rebuked the wind, and said to the sea, “Peace! Be still!” The wind ceased, and there was a great calm."},{"v":40,"t":"He said to them, “Why are you so afraid? How is it that you have no faith?”"},{"v":41,"t":"They were greatly afraid, and said to one another, “Who then is this, that even the wind and the sea obey him?”"}]}],"context":"The crowds swell — and so does the opposition. Jesus appoints twelve apostles, is accused of working for Satan, and redefines who counts as his family. Then he teaches in parables — the sower, the growing seed, the mustard seed — and silences a storm with a word.","notes":[{"h":"The Twelve (3:13–19)","t":"Twelve deliberately echoes the twelve tribes of Israel. Jesus is re‑forming God’s people around himself — a quiet but enormous claim."},{"h":"The “unforgivable sin” (3:22–30)","t":"The scribes call Jesus’ obviously good, Spirit‑empowered work the devil’s doing — calling light darkness. The “unforgivable” posture is a settled, deliberate refusal to recognise God at all. If you’re worried you’ve committed it, that worry is itself evidence you haven’t."},{"h":"Jesus’ true family (3:31–35)","t":"“Whoever does God’s will is my brother and sister and mother.” Kinship is redefined around relationship with God, not bloodline."},{"h":"Why parables? (4:10–12)","t":"Parables both reveal and conceal. They invite the humble to lean in and ask, while letting the dismissive stay on the surface. Understanding is given to those who come asking (4:10)."},{"h":"The Sower (4:1–20)","t":"The same seed (God’s word) lands on four soils. The difference in outcome is the soil — the heart’s receptivity — not the seed."},{"h":"“Who is this?” (4:35–41)","t":"In the Old Testament, only God commands the sea. When wind and waves obey Jesus, the terrified disciples ask the question the whole Gospel is really about: “Who then is this?”"}],"questions":[{"q":"Have I committed the unforgivable sin?","a":"Almost certainly not — the very worry shows a soft heart. It describes a deliberate, persistent naming of God’s good work as evil, not a moment of doubt or a past failure you regret."},{"q":"Why would Jesus teach so that some “may not understand” (4:12)?","a":"Parables sort hearts. They’re an invitation, not a wall: those who come asking are given the meaning (4:10). The teaching rewards humility and curiosity over cleverness."},{"q":"Was Jesus really asleep in a deadly storm?","a":"Yes — a striking picture of both his real humanity (he was exhausted) and his total peace. He isn’t anxious because he isn’t in the danger the disciples think he’s in."}],"discuss":{"observe":"In the parable of the sower, Jesus names four “soils.” Honestly — which soil feels most like your heart in this season, and why?","meaning":"The disciples cry, “Who is this, that even wind and sea obey him?” After these chapters, how would you answer them?","apply":"The kingdom starts like a mustard seed — tiny. Where might God be growing something small in our marriage or home that we’re tempted to overlook for being small?"},"prayer":"Lord, make our hearts good soil. Quiet the storms we’re afraid of, and grow your kingdom in us — even when the beginnings feel small. Amen."},{"id":"s3","n":3,"title":"Power and Rejection","subtitle":"Mark 5–6","ref":"Mark 5–6","nivUrl":"https://www.biblegateway.com/passage/?search=Mark%205-6&version=NIV","chapters":[{"n":5,"verses":[{"v":1,"t":"They came to the other side of the sea, into the country of the Gadarenes."},{"v":2,"t":"When he had come out of the boat, immediately a man with an unclean spirit met him out of the tombs."},{"v":3,"t":"He lived in the tombs. Nobody could bind him any more, not even with chains,"},{"v":4,"t":"because he had been often bound with fetters and chains, and the chains had been torn apart by him, and the fetters broken in pieces. Nobody had the strength to tame him."},{"v":5,"t":"Always, night and day, in the tombs and in the mountains, he was crying out, and cutting himself with stones."},{"v":6,"t":"When he saw Jesus from afar, he ran and bowed down to him,"},{"v":7,"t":"and crying out with a loud voice, he said, “What have I to do with you, Jesus, you Son of the Most High God? I adjure you by God, don’t torment me.”"},{"v":8,"t":"For he said to him, “Come out of the man, you unclean spirit!”"},{"v":9,"t":"He asked him, “What is your name?” He said to him, “My name is Legion, for we are many.”"},{"v":10,"t":"He begged him much that he would not send them away out of the country."},{"v":11,"t":"Now on the mountainside there was a great herd of pigs feeding."},{"v":12,"t":"All the demons begged him, saying, “Send us into the pigs, that we may enter into them.”"},{"v":13,"t":"At once Jesus gave them permission. The unclean spirits came out and entered into the pigs. The herd of about two thousand rushed down the steep bank into the sea, and they were drowned in the sea."},{"v":14,"t":"Those who fed them fled, and told it in the city and in the country. The people came to see what it was that had happened."},{"v":15,"t":"They came to Jesus, and saw him who had been possessed by demons sitting, clothed, and in his right mind, even him who had the legion; and they were afraid."},{"v":16,"t":"Those who saw it declared to them what happened to him who was possessed by demons, and about the pigs."},{"v":17,"t":"They began to beg him to depart from their region."},{"v":18,"t":"As he was entering into the boat, he who had been possessed by demons begged him that he might be with him."},{"v":19,"t":"He didn’t allow him, but said to him, “Go to your house, to your friends, and tell them what great things the Lord has done for you, and how he had mercy on you.”"},{"v":20,"t":"He went his way, and began to proclaim in Decapolis how Jesus had done great things for him, and everyone marveled."},{"v":21,"t":"When Jesus had crossed back over in the boat to the other side, a great multitude was gathered to him; and he was by the sea."},{"v":22,"t":"Behold, one of the rulers of the synagogue, Jairus by name, came; and seeing him, he fell at his feet,"},{"v":23,"t":"and begged him much, saying, “My little daughter is at the point of death. Please come and lay your hands on her, that she may be made healthy, and live.”"},{"v":24,"t":"He went with him, and a great multitude followed him, and they pressed upon him on all sides."},{"v":25,"t":"A certain woman, who had an issue of blood for twelve years,"},{"v":26,"t":"and had suffered many things by many physicians, and had spent all that she had, and was no better, but rather grew worse,"},{"v":27,"t":"having heard the things concerning Jesus, came up behind him in the crowd, and touched his clothes."},{"v":28,"t":"For she said, “If I just touch his clothes, I will be made well.”"},{"v":29,"t":"Immediately the flow of her blood was dried up, and she felt in her body that she was healed of her affliction."},{"v":30,"t":"Immediately Jesus, perceiving in himself that the power had gone out from him, turned around in the crowd, and asked, “Who touched my clothes?”"},{"v":31,"t":"His disciples said to him, “You see the multitude pressing against you, and you say, ‘Who touched me?’”"},{"v":32,"t":"He looked around to see her who had done this thing."},{"v":33,"t":"But the woman, fearing and trembling, knowing what had been done to her, came and fell down before him, and told him all the truth."},{"v":34,"t":"He said to her, “Daughter, your faith has made you well. Go in peace, and be cured of your disease.”"},{"v":35,"t":"While he was still speaking, people came from the synagogue ruler’s house saying, “Your daughter is dead. Why bother the Teacher any more?”"},{"v":36,"t":"But Jesus, when he heard the message spoken, immediately said to the ruler of the synagogue, “Don’t be afraid, only believe.”"},{"v":37,"t":"He allowed no one to follow him, except Peter, James, and John the brother of James."},{"v":38,"t":"He came to the synagogue ruler’s house, and he saw an uproar, weeping, and great wailing."},{"v":39,"t":"When he had entered in, he said to them, “Why do you make an uproar and weep? The child is not dead, but is asleep.”"},{"v":40,"t":"They ridiculed him. But he, having put them all out, took the father of the child, her mother, and those who were with him, and went in where the child was lying."},{"v":41,"t":"Taking the child by the hand, he said to her, “Talitha cumi!” which means, being interpreted, “Girl, I tell you, get up!”"},{"v":42,"t":"Immediately the girl rose up and walked, for she was twelve years old. They were amazed with great amazement."},{"v":43,"t":"He strictly ordered them that no one should know this, and commanded that something should be given to her to eat."}]},{"n":6,"verses":[{"v":1,"t":"He went out from there. He came into his own country, and his disciples followed him."},{"v":2,"t":"When the Sabbath had come, he began to teach in the synagogue, and many hearing him were astonished, saying, “Where did this man get these things?” and, “What is the wisdom that is given to this man, that such mighty works come about by his hands?"},{"v":3,"t":"Isn’t this the carpenter, the son of Mary, and brother of James, Joses, Judah, and Simon? Aren’t his sisters here with us?” They were offended at him."},{"v":4,"t":"Jesus said to them, “A prophet is not without honor, except in his own country, and among his own relatives, and in his own house.”"},{"v":5,"t":"He could do no mighty work there, except that he laid his hands on a few sick people, and healed them."},{"v":6,"t":"He marveled because of their unbelief. He went around the villages teaching."},{"v":7,"t":"He called to himself the twelve, and began to send them out two by two; and he gave them authority over the unclean spirits."},{"v":8,"t":"He commanded them that they should take nothing for their journey, except a staff only: no bread, no wallet, no money in their purse,"},{"v":9,"t":"but to wear sandals, and not put on two tunics."},{"v":10,"t":"He said to them, “Wherever you enter into a house, stay there until you depart from there."},{"v":11,"t":"Whoever will not receive you nor hear you, as you depart from there, shake off the dust that is under your feet for a testimony against them. Assuredly, I tell you, it will be more tolerable for Sodom and Gomorrah in the day of judgment than for that city!”"},{"v":12,"t":"They went out and preached that people should repent."},{"v":13,"t":"They cast out many demons, and anointed many with oil who were sick, and healed them."},{"v":14,"t":"King Herod heard this, for his name had become known, and he said, “John the Baptizer has risen from the dead, and therefore these powers are at work in him.”"},{"v":15,"t":"But others said, “He is Elijah.” Others said, “He is a prophet, or like one of the prophets.”"},{"v":16,"t":"But Herod, when he heard this, said, “This is John, whom I beheaded. He has risen from the dead.”"},{"v":17,"t":"For Herod himself had sent out and arrested John, and bound him in prison for the sake of Herodias, his brother Philip’s wife, for he had married her."},{"v":18,"t":"For John said to Herod, “It is not lawful for you to have your brother’s wife.”"},{"v":19,"t":"Herodias set herself against him, and desired to kill him, but she couldn’t,"},{"v":20,"t":"for Herod feared John, knowing that he was a righteous and holy man, and kept him safe. When he heard him, he did many things, and he heard him gladly."},{"v":21,"t":"Then a convenient day came, that Herod on his birthday made a supper for his nobles, the high officers, and the chief men of Galilee."},{"v":22,"t":"When the daughter of Herodias herself came in and danced, she pleased Herod and those sitting with him. The king said to the young lady, “Ask me whatever you want, and I will give it to you.”"},{"v":23,"t":"He swore to her, “Whatever you shall ask of me, I will give you, up to half of my kingdom.”"},{"v":24,"t":"She went out, and said to her mother, “What shall I ask?” She said, “The head of John the Baptizer.”"},{"v":25,"t":"She came in immediately with haste to the king, and asked, “I want you to give me right now the head of John the Baptizer on a platter.”"},{"v":26,"t":"The king was exceedingly sorry, but for the sake of his oaths, and of his dinner guests, he didn’t wish to refuse her."},{"v":27,"t":"Immediately the king sent out a soldier of his guard, and commanded to bring John’s head, and he went and beheaded him in the prison,"},{"v":28,"t":"and brought his head on a platter, and gave it to the young lady; and the young lady gave it to her mother."},{"v":29,"t":"When his disciples heard this, they came and took up his corpse, and laid it in a tomb."},{"v":30,"t":"The apostles gathered themselves together to Jesus, and they told him all things, whatever they had done, and whatever they had taught."},{"v":31,"t":"He said to them, “You come apart into a deserted place, and rest awhile.” For there were many coming and going, and they had no leisure so much as to eat."},{"v":32,"t":"They went away in the boat to a deserted place by themselves."},{"v":33,"t":"They saw them going, and many recognized him and ran there on foot from all the cities. They arrived before them and came together to him."},{"v":34,"t":"Jesus came out, saw a great multitude, and he had compassion on them, because they were like sheep without a shepherd, and he began to teach them many things."},{"v":35,"t":"When it was late in the day, his disciples came to him, and said, “This place is deserted, and it is late in the day."},{"v":36,"t":"Send them away, that they may go into the surrounding country and villages, and buy themselves bread, for they have nothing to eat.”"},{"v":37,"t":"But he answered them, “You give them something to eat.” They asked him, “Shall we go and buy two hundred denarii worth of bread, and give them something to eat?”"},{"v":38,"t":"He said to them, “How many loaves do you have? Go see.” When they knew, they said, “Five, and two fish.”"},{"v":39,"t":"He commanded them that everyone should sit down in groups on the green grass."},{"v":40,"t":"They sat down in ranks, by hundreds and by fifties."},{"v":41,"t":"He took the five loaves and the two fish, and looking up to heaven, he blessed and broke the loaves, and he gave to his disciples to set before them, and he divided the two fish among them all."},{"v":42,"t":"They all ate, and were filled."},{"v":43,"t":"They took up twelve baskets full of broken pieces and also of the fish."},{"v":44,"t":"Those who ate the loaves were five thousand men."},{"v":45,"t":"Immediately he made his disciples get into the boat, and to go ahead to the other side, to Bethsaida, while he himself sent the multitude away."},{"v":46,"t":"After he had taken leave of them, he went up the mountain to pray."},{"v":47,"t":"When evening had come, the boat was in the middle of the sea, and he was alone on the land."},{"v":48,"t":"Seeing them distressed in rowing, for the wind was contrary to them, about the fourth watch of the night he came to them, walking on the sea, and he would have passed by them,"},{"v":49,"t":"but they, when they saw him walking on the sea, supposed that it was a ghost, and cried out;"},{"v":50,"t":"for they all saw him, and were troubled. But he immediately spoke with them, and said to them, “Cheer up! It is I! Don’t be afraid.”"},{"v":51,"t":"He got into the boat with them; and the wind ceased, and they were very amazed among themselves, and marveled;"},{"v":52,"t":"for they hadn’t understood about the loaves, but their hearts were hardened."},{"v":53,"t":"When they had crossed over, they came to land at Gennesaret, and moored to the shore."},{"v":54,"t":"When they had come out of the boat, immediately the people recognized him,"},{"v":55,"t":"and ran around that whole region, and began to bring those who were sick, on their mats, to where they heard he was."},{"v":56,"t":"Wherever he entered, into villages, or into cities, or into the country, they laid the sick in the marketplaces, and begged him that they might just touch the fringe of his garment; and as many as touched him were made well."}]}],"context":"Jesus’ authority goes on full display — a legion of demons, a bleeding woman, a dead girl raised — and yet he’s rejected in his own hometown. He sends out the Twelve, John the Baptizer is executed, and Jesus feeds five thousand and walks on water.","notes":[{"h":"“Legion” (5:1–20)","t":"A Roman legion was around six thousand soldiers — the name signals overwhelming oppression. Jesus restores the man to his right mind; note that the townspeople end up preferring their pigs to the miracle."},{"h":"A story inside a story (5:21–43)","t":"Mark often “sandwiches” one account inside another. A dying girl and a woman bleeding for twelve years are both considered “unclean” and beyond hope — and Jesus reverses uncleanness simply by touch. “Talitha cumi” is Aramaic: “Little girl, get up.”"},{"h":"“Who touched my clothes?” (5:30)","t":"Not magic — Jesus draws the woman’s hidden faith out into the open, then calls her “daughter.” He wants relationship, not anonymous rescue."},{"h":"Rejected at home (6:1–6)","t":"“A prophet is not without honour except in his hometown.” Familiarity breeds unbelief. Note that Jesus “could do no mighty work there” — he works relationally, and won’t force his way past a closed door."},{"h":"John the Baptizer’s death (6:14–29)","t":"Herod’s grim banquet. Mark places it here as a shadow of what’s coming — the fate of the forerunner hints at the fate of Jesus."},{"h":"Feeding the 5,000 (6:30–44)","t":"The only miracle in all four Gospels. Jesus is the true shepherd feeding his flock (echoes of Moses and the manna, and of Psalm 23). “Green grass” is a small eyewitness detail."}],"questions":[{"q":"Why did Jesus send the demons into the pigs?","a":"Mark doesn’t fully explain it. The focus is the man’s rescue and the visible proof of what had oppressed him — and the sobering reaction of a town that then asks Jesus to leave."},{"q":"Could Jesus really “do no mighty work” in Nazareth — is his power limited by our belief?","a":"Not that he’s unable, but that he works within relationship. Where people slam the door of faith, he doesn’t barge through. Trust opens a space that unbelief closes."},{"q":"Why walk on water — what’s the point of that one (6:45–52)?","a":"It’s another unveiling of who he is. His words “It is I” echo God’s name “I AM,” and “do not be afraid” is what God says when he draws near. Even so, the disciples’ “hearts were hardened” — they’re slow, like us."}],"discuss":{"observe":"Two desperate people come to Jesus in chapter 5 — an important synagogue leader and an unnamed, “unclean” woman. What do you notice about how he treats each of them?","meaning":"The hometown crowd “knew” Jesus and so missed him. Where might familiarity be a danger for us — assuming we already know Jesus?","apply":"Jesus looked at a tired crowd, had compassion, and fed them. Who in our life right now are we being nudged toward with that kind of compassion?"},"prayer":"Jesus, you touched the untouchable and fed the hungry. Grow our faith past mere familiarity into real trust, and make us people of compassion. Amen."},{"id":"s4","n":4,"title":"The Great Turn","subtitle":"Mark 7–8","ref":"Mark 7–8","nivUrl":"https://www.biblegateway.com/passage/?search=Mark%207-8&version=NIV","chapters":[{"n":7,"verses":[{"v":1,"t":"Then the Pharisees and some of the scribes gathered together to him, having come from Jerusalem."},{"v":2,"t":"Now when they saw some of his disciples eating bread with defiled, that is unwashed, hands, they found fault."},{"v":3,"t":"(For the Pharisees and all the Jews, don’t eat unless they wash their hands and forearms, holding to the tradition of the elders."},{"v":4,"t":"They don’t eat when they come from the marketplace unless they bathe themselves, and there are many other things, which they have received to hold to: washings of cups, pitchers, bronze vessels, and couches.)"},{"v":5,"t":"The Pharisees and the scribes asked him, “Why don’t your disciples walk according to the tradition of the elders, but eat their bread with unwashed hands?”"},{"v":6,"t":"He answered them, “Well did Isaiah prophesy of you hypocrites, as it is written, ‘This people honors me with their lips, but their heart is far from me."},{"v":7,"t":"But they worship me in vain, teaching as doctrines the commandments of men.’"},{"v":8,"t":"“For you set aside the commandment of God, and hold tightly to the tradition of men—the washing of pitchers and cups, and you do many other such things.”"},{"v":9,"t":"He said to them, “Full well do you reject the commandment of God, that you may keep your tradition."},{"v":10,"t":"For Moses said, ‘Honor your father and your mother;’ and, ‘He who speaks evil of father or mother, let him be put to death.’"},{"v":11,"t":"But you say, ‘If a man tells his father or his mother, “Whatever profit you might have received from me is Corban, that is to say, given to God”;’"},{"v":12,"t":"then you no longer allow him to do anything for his father or his mother,"},{"v":13,"t":"making void the word of God by your tradition, which you have handed down. You do many things like this.”"},{"v":14,"t":"He called all the multitude to himself, and said to them, “Hear me, all of you, and understand."},{"v":15,"t":"There is nothing from outside of the man, that going into him can defile him; but the things which proceed out of the man are those that defile the man."},{"v":16,"t":"If anyone has ears to hear, let him hear!”"},{"v":17,"t":"When he had entered into a house away from the multitude, his disciples asked him about the parable."},{"v":18,"t":"He said to them, “Are you also without understanding? Don’t you perceive that whatever goes into the man from outside can’t defile him,"},{"v":19,"t":"because it doesn’t go into his heart, but into his stomach, then into the latrine, thus purifying all foods?”"},{"v":20,"t":"He said, “That which proceeds out of the man, that defiles the man."},{"v":21,"t":"For from within, out of the hearts of men, proceed evil thoughts, adulteries, sexual sins, murders, thefts,"},{"v":22,"t":"covetings, wickedness, deceit, lustful desires, an evil eye, blasphemy, pride, and foolishness."},{"v":23,"t":"All these evil things come from within, and defile the man.”"},{"v":24,"t":"From there he arose, and went away into the borders of Tyre and Sidon. He entered into a house, and didn’t want anyone to know it, but he couldn’t escape notice."},{"v":25,"t":"For a woman, whose little daughter had an unclean spirit, having heard of him, came and fell down at his feet."},{"v":26,"t":"Now the woman was a Greek, a Syrophoenician by race. She begged him that he would cast the demon out of her daughter."},{"v":27,"t":"But Jesus said to her, “Let the children be filled first, for it is not appropriate to take the children’s bread and throw it to the dogs.”"},{"v":28,"t":"But she answered him, “Yes, Lord. Yet even the dogs under the table eat the children’s crumbs.”"},{"v":29,"t":"He said to her, “For this saying, go your way. The demon has gone out of your daughter.”"},{"v":30,"t":"She went away to her house, and found the child having been laid on the bed, with the demon gone out."},{"v":31,"t":"Again he departed from the borders of Tyre and Sidon, and came to the sea of Galilee, through the middle of the region of Decapolis."},{"v":32,"t":"They brought to him one who was deaf and had an impediment in his speech. They begged him to lay his hand on him."},{"v":33,"t":"He took him aside from the multitude, privately, and put his fingers into his ears, and he spat, and touched his tongue."},{"v":34,"t":"Looking up to heaven, he sighed, and said to him, “Ephphatha!” that is, “Be opened!”"},{"v":35,"t":"Immediately his ears were opened, and the impediment of his tongue was released, and he spoke clearly."},{"v":36,"t":"He commanded them that they should tell no one, but the more he commanded them, so much the more widely they proclaimed it."},{"v":37,"t":"They were astonished beyond measure, saying, “He has done all things well. He makes even the deaf hear, and the mute speak!”"}]},{"n":8,"verses":[{"v":1,"t":"In those days, when there was a very great multitude, and they had nothing to eat, Jesus called his disciples to himself, and said to them,"},{"v":2,"t":"“I have compassion on the multitude, because they have stayed with me now three days, and have nothing to eat."},{"v":3,"t":"If I send them away fasting to their home, they will faint on the way, for some of them have come a long way.”"},{"v":4,"t":"His disciples answered him, “From where could one satisfy these people with bread here in a deserted place?”"},{"v":5,"t":"He asked them, “How many loaves do you have?” They said, “Seven.”"},{"v":6,"t":"He commanded the multitude to sit down on the ground, and he took the seven loaves. Having given thanks, he broke them, and gave them to his disciples to serve, and they served the multitude."},{"v":7,"t":"They had a few small fish. Having blessed them, he said to serve these also."},{"v":8,"t":"They ate, and were filled. They took up seven baskets of broken pieces that were left over."},{"v":9,"t":"Those who had eaten were about four thousand. Then he sent them away."},{"v":10,"t":"Immediately he entered into the boat with his disciples, and came into the region of Dalmanutha."},{"v":11,"t":"The Pharisees came out and began to question him, seeking from him a sign from heaven, and testing him."},{"v":12,"t":"He sighed deeply in his spirit, and said, “Why does this generation seek a sign? Most certainly I tell you, no sign will be given to this generation.”"},{"v":13,"t":"He left them, and again entering into the boat, departed to the other side."},{"v":14,"t":"They forgot to take bread; and they didn’t have more than one loaf in the boat with them."},{"v":15,"t":"He warned them, saying, “Take heed: beware of the yeast of the Pharisees and the yeast of Herod.”"},{"v":16,"t":"They reasoned with one another, saying, “It’s because we have no bread.”"},{"v":17,"t":"Jesus, perceiving it, said to them, “Why do you reason that it’s because you have no bread? Don’t you perceive yet, neither understand? Is your heart still hardened?"},{"v":18,"t":"Having eyes, don’t you see? Having ears, don’t you hear? Don’t you remember?"},{"v":19,"t":"When I broke the five loaves among the five thousand, how many baskets full of broken pieces did you take up?” They told him, “Twelve.”"},{"v":20,"t":"“When the seven loaves fed the four thousand, how many baskets full of broken pieces did you take up?” They told him, “Seven.”"},{"v":21,"t":"He asked them, “Don’t you understand yet?”"},{"v":22,"t":"He came to Bethsaida. They brought a blind man to him, and begged him to touch him."},{"v":23,"t":"He took hold of the blind man by the hand, and brought him out of the village. When he had spat on his eyes, and laid his hands on him, he asked him if he saw anything."},{"v":24,"t":"He looked up, and said, “I see men; for I see them like trees walking.”"},{"v":25,"t":"Then again he laid his hands on his eyes. He looked intently, and was restored, and saw everyone clearly."},{"v":26,"t":"He sent him away to his house, saying, “Don’t enter into the village, nor tell anyone in the village.”"},{"v":27,"t":"Jesus went out, with his disciples, into the villages of Caesarea Philippi. On the way he asked his disciples, “Who do men say that I am?”"},{"v":28,"t":"They told him, “John the Baptizer, and others say Elijah, but others: one of the prophets.”"},{"v":29,"t":"He said to them, “But who do you say that I am?” Peter answered, “You are the Christ.”"},{"v":30,"t":"He commanded them that they should tell no one about him."},{"v":31,"t":"He began to teach them that the Son of Man must suffer many things, and be rejected by the elders, the chief priests, and the scribes, and be killed, and after three days rise again."},{"v":32,"t":"He spoke to them openly. Peter took him, and began to rebuke him."},{"v":33,"t":"But he, turning around, and seeing his disciples, rebuked Peter, and said, “Get behind me, Satan! For you have in mind not the things of God, but the things of men.”"},{"v":34,"t":"He called the multitude to himself with his disciples, and said to them, “Whoever wants to come after me, let him deny himself, and take up his cross, and follow me."},{"v":35,"t":"For whoever wants to save his life will lose it; and whoever will lose his life for my sake and the sake of the Good News will save it."},{"v":36,"t":"For what does it profit a man, to gain the whole world, and forfeit his life?"},{"v":37,"t":"For what will a man give in exchange for his life?"},{"v":38,"t":"For whoever will be ashamed of me and of my words in this adulterous and sinful generation, the Son of Man also will be ashamed of him, when he comes in his Father’s glory, with the holy angels.”"}]}],"context":"Jesus challenges religion that’s all about external rule‑keeping, insisting the heart is the real problem — and he extends mercy to outsiders. It all builds to the hinge of the whole Gospel: Peter’s confession “You are the Christ,” followed at once by Jesus’ first prediction of the cross.","notes":[{"h":"What really defiles (7:14–23)","t":"The dispute isn’t about hygiene but ritual purity traditions. Jesus relocates the problem from the menu to the heart — “thus he declared all foods clean” is a huge statement. Read his list of what comes “out of the heart” slowly."},{"h":"The Syrophoenician woman (7:24–30)","t":"She’s a Gentile — an outsider. The “children’s bread / dogs” exchange sounds harsh, but the word is closer to “household pet,” and Jesus seems to be drawing out her remarkable faith. Her humble, witty persistence wins his praise — a signpost that mercy is reaching beyond Israel."},{"h":"Healing in two stages (8:22–26)","t":"The only miracle Jesus does in two steps — the man first sees people “like trees walking,” then clearly. It’s a living parable: the disciples, like this man, see partly and need a second touch. Mark places it right before Peter’s half‑sighted confession."},{"h":"Peter’s confession (8:27–30)","t":"“You are the Christ.” This is the turning point. The first half of Mark keeps asking “who is he?” — and here it’s finally answered out loud."},{"h":"The first passion prediction (8:31–33)","t":"Immediately Jesus says the Christ must suffer, be killed, and rise. Peter rebukes him — and gets “Get behind me, Satan.” Peter has the right title but the wrong job description in mind."},{"h":"“Take up your cross” (8:34–38)","t":"To Jesus’ first hearers the cross wasn’t jewellery — it was Rome’s instrument of shameful execution. Following Jesus means a death to self, and finding real life on the far side of it."}],"questions":[{"q":"Did Jesus really call the woman a “dog”? Isn’t that cruel?","a":"The word is a softer one — a little household dog, not a stray. The encounter reads as a deliberate drawing‑out of her extraordinary faith, and it ends in her praise and her daughter’s healing: mercy crossing a boundary that everyone else assumed was fixed."},{"q":"Why heal the blind man in two stages — couldn’t Jesus do it at once?","a":"Of course he could. The two stages are a deliberate acted parable about seeing Jesus partly, then fully — mirroring the disciples exactly at this hinge in the story."},{"q":"Why does Peter get called “Satan” for caring about Jesus?","a":"Peter was urging Jesus to skip the cross — the very temptation Jesus faced in the wilderness. Loving Jesus while resisting his mission can quietly put us on the wrong side of it."}],"discuss":{"observe":"Jesus says defilement comes “from within, out of the heart.” What’s surprising — or uncomfortable — about moving the problem from outside to inside?","meaning":"Peter gets the title right (“you are the Christ”) but the job description wrong. What mistaken expectations of Jesus might we quietly carry?","apply":"“Take up your cross and follow me.” In plain terms, what might cross‑shaped love cost each of us this week — at home, at work?"},"prayer":"Jesus, cleanse us from the inside out. Open our eyes to see you fully — not the Christ we’d prefer to invent, but the one who goes to the cross — and give us grace to follow. Amen."},{"id":"s5","n":5,"title":"The Upside-Down Kingdom","subtitle":"Mark 9–10","ref":"Mark 9–10","nivUrl":"https://www.biblegateway.com/passage/?search=Mark%209-10&version=NIV","chapters":[{"n":9,"verses":[{"v":1,"t":"He said to them, “Most certainly I tell you, there are some standing here who will in no way taste death until they see God’s Kingdom come with power.”"},{"v":2,"t":"After six days Jesus took with him Peter, James, and John, and brought them up onto a high mountain privately by themselves, and he was changed into another form in front of them."},{"v":3,"t":"His clothing became glistening, exceedingly white, like snow, such as no launderer on earth can whiten them."},{"v":4,"t":"Elijah and Moses appeared to them, and they were talking with Jesus."},{"v":5,"t":"Peter answered Jesus, “Rabbi, it is good for us to be here. Let’s make three tents: one for you, one for Moses, and one for Elijah.”"},{"v":6,"t":"For he didn’t know what to say, for they were very afraid."},{"v":7,"t":"A cloud came, overshadowing them, and a voice came out of the cloud, “This is my beloved Son. Listen to him.”"},{"v":8,"t":"Suddenly looking around, they saw no one with them any more, except Jesus only."},{"v":9,"t":"As they were coming down from the mountain, he commanded them that they should tell no one what things they had seen, until after the Son of Man had risen from the dead."},{"v":10,"t":"They kept this saying to themselves, questioning what the “rising from the dead” meant."},{"v":11,"t":"They asked him, saying, “Why do the scribes say that Elijah must come first?”"},{"v":12,"t":"He said to them, “Elijah indeed comes first, and restores all things. How is it written about the Son of Man, that he should suffer many things and be despised?"},{"v":13,"t":"But I tell you that Elijah has come, and they have also done to him whatever they wanted to, even as it is written about him.”"},{"v":14,"t":"Coming to the disciples, he saw a great multitude around them, and scribes questioning them."},{"v":15,"t":"Immediately all the multitude, when they saw him, were greatly amazed, and running to him, greeted him."},{"v":16,"t":"He asked the scribes, “What are you asking them?”"},{"v":17,"t":"One of the multitude answered, “Teacher, I brought to you my son, who has a mute spirit;"},{"v":18,"t":"and wherever it seizes him, it throws him down, and he foams at the mouth, and grinds his teeth, and wastes away. I asked your disciples to cast it out, and they weren’t able.”"},{"v":19,"t":"He answered him, “Unbelieving generation, how long shall I be with you? How long shall I bear with you? Bring him to me.”"},{"v":20,"t":"They brought him to him, and when he saw him, immediately the spirit convulsed him, and he fell on the ground, wallowing and foaming at the mouth."},{"v":21,"t":"He asked his father, “How long has it been since this has come to him?” He said, “From childhood."},{"v":22,"t":"Often it has cast him both into the fire and into the water, to destroy him. But if you can do anything, have compassion on us, and help us.”"},{"v":23,"t":"Jesus said to him, “If you can believe, all things are possible to him who believes.”"},{"v":24,"t":"Immediately the father of the child cried out with tears, “I believe. Help my unbelief!”"},{"v":25,"t":"When Jesus saw that a multitude came running together, he rebuked the unclean spirit, saying to him, “You mute and deaf spirit, I command you, come out of him, and never enter him again!”"},{"v":26,"t":"After crying out and convulsing him greatly, it came out of him. The boy became like one dead; so much that most of them said, “He is dead.”"},{"v":27,"t":"But Jesus took him by the hand, and raised him up; and he arose."},{"v":28,"t":"When he had come into the house, his disciples asked him privately, “Why couldn’t we cast it out?”"},{"v":29,"t":"He said to them, “This kind can come out by nothing, except by prayer and fasting.”"},{"v":30,"t":"They went out from there, and passed through Galilee. He didn’t want anyone to know it."},{"v":31,"t":"For he was teaching his disciples, and said to them, “The Son of Man is being handed over to the hands of men, and they will kill him; and when he is killed, on the third day he will rise again.”"},{"v":32,"t":"But they didn’t understand the saying, and were afraid to ask him."},{"v":33,"t":"He came to Capernaum, and when he was in the house he asked them, “What were you arguing among yourselves on the way?”"},{"v":34,"t":"But they were silent, for they had disputed one with another on the way about who was the greatest."},{"v":35,"t":"He sat down, and called the twelve; and he said to them, “If any man wants to be first, he shall be last of all, and servant of all.”"},{"v":36,"t":"He took a little child, and set him in the middle of them. Taking him in his arms, he said to them,"},{"v":37,"t":"“Whoever receives one such little child in my name, receives me, and whoever receives me, doesn’t receive me, but him who sent me.”"},{"v":38,"t":"John said to him, “Teacher, we saw someone who doesn’t follow us casting out demons in your name; and we forbade him, because he doesn’t follow us.”"},{"v":39,"t":"But Jesus said, “Don’t forbid him, for there is no one who will do a mighty work in my name, and be able quickly to speak evil of me."},{"v":40,"t":"For whoever is not against us is on our side."},{"v":41,"t":"For whoever will give you a cup of water to drink in my name, because you are Christ’s, most certainly I tell you, he will in no way lose his reward."},{"v":42,"t":"Whoever will cause one of these little ones who believe in me to stumble, it would be better for him if he were thrown into the sea with a millstone hung around his neck."},{"v":43,"t":"If your hand causes you to stumble, cut it off. It is better for you to enter into life maimed, rather than having your two hands to go into Gehenna, into the unquenchable fire,"},{"v":44,"t":"‘where their worm doesn’t die, and the fire is not quenched.’"},{"v":45,"t":"If your foot causes you to stumble, cut it off. It is better for you to enter into life lame, rather than having your two feet to be cast into Gehenna, into the fire that will never be quenched—"},{"v":46,"t":"‘where their worm doesn’t die, and the fire is not quenched.’"},{"v":47,"t":"If your eye causes you to stumble, cast it out. It is better for you to enter into God’s Kingdom with one eye, rather than having two eyes to be cast into the Gehenna of fire,"},{"v":48,"t":"‘where their worm doesn’t die, and the fire is not quenched.’"},{"v":49,"t":"For everyone will be salted with fire, and every sacrifice will be seasoned with salt."},{"v":50,"t":"Salt is good, but if the salt has lost its saltiness, with what will you season it? Have salt in yourselves, and be at peace with one another.”"}]},{"n":10,"verses":[{"v":1,"t":"He arose from there and came into the borders of Judea and beyond the Jordan. Multitudes came together to him again. As he usually did, he was again teaching them."},{"v":2,"t":"Pharisees came to him testing him, and asked him, “Is it lawful for a man to divorce his wife?”"},{"v":3,"t":"He answered, “What did Moses command you?”"},{"v":4,"t":"They said, “Moses allowed a certificate of divorce to be written, and to divorce her.”"},{"v":5,"t":"But Jesus said to them, “For your hardness of heart, he wrote you this commandment."},{"v":6,"t":"But from the beginning of the creation, God made them male and female."},{"v":7,"t":"For this cause a man will leave his father and mother, and will join to his wife,"},{"v":8,"t":"and the two will become one flesh, so that they are no longer two, but one flesh."},{"v":9,"t":"What therefore God has joined together, let no man separate.”"},{"v":10,"t":"In the house, his disciples asked him again about the same matter."},{"v":11,"t":"He said to them, “Whoever divorces his wife, and marries another, commits adultery against her."},{"v":12,"t":"If a woman herself divorces her husband, and marries another, she commits adultery.”"},{"v":13,"t":"They were bringing to him little children, that he should touch them, but the disciples rebuked those who were bringing them."},{"v":14,"t":"But when Jesus saw it, he was moved with indignation, and said to them, “Allow the little children to come to me! Don’t forbid them, for God’s Kingdom belongs to such as these."},{"v":15,"t":"Most certainly I tell you, whoever will not receive God’s Kingdom like a little child, he will in no way enter into it.”"},{"v":16,"t":"He took them in his arms, and blessed them, laying his hands on them."},{"v":17,"t":"As he was going out into the way, one ran to him, knelt before him, and asked him, “Good Teacher, what shall I do that I may inherit eternal life?”"},{"v":18,"t":"Jesus said to him, “Why do you call me good? No one is good except one—God."},{"v":19,"t":"You know the commandments: ‘Do not murder,’ ‘Do not commit adultery,’ ‘Do not steal,’ ‘Do not give false testimony,’ ‘Do not defraud,’ ‘Honor your father and mother.’”"},{"v":20,"t":"He said to him, “Teacher, I have observed all these things from my youth.”"},{"v":21,"t":"Jesus looking at him loved him, and said to him, “One thing you lack. Go, sell whatever you have, and give to the poor, and you will have treasure in heaven; and come, follow me, taking up the cross.”"},{"v":22,"t":"But his face fell at that saying, and he went away sorrowful, for he was one who had great possessions."},{"v":23,"t":"Jesus looked around, and said to his disciples, “How difficult it is for those who have riches to enter into God’s Kingdom!”"},{"v":24,"t":"The disciples were amazed at his words. But Jesus answered again, “Children, how hard is it for those who trust in riches to enter into God’s Kingdom!"},{"v":25,"t":"It is easier for a camel to go through a needle’s eye than for a rich man to enter into God’s Kingdom.”"},{"v":26,"t":"They were exceedingly astonished, saying to him, “Then who can be saved?”"},{"v":27,"t":"Jesus, looking at them, said, “With men it is impossible, but not with God, for all things are possible with God.”"},{"v":28,"t":"Peter began to tell him, “Behold, we have left all, and have followed you.”"},{"v":29,"t":"Jesus said, “Most certainly I tell you, there is no one who has left house, or brothers, or sisters, or father, or mother, or wife, or children, or land, for my sake, and for the sake of the Good News,"},{"v":30,"t":"but he will receive one hundred times more now in this time, houses, brothers, sisters, mothers, children, and land, with persecutions; and in the age to come eternal life."},{"v":31,"t":"But many who are first will be last; and the last first.”"},{"v":32,"t":"They were on the way, going up to Jerusalem; and Jesus was going in front of them, and they were amazed; and those who followed were afraid. He again took the twelve, and began to tell them the things that were going to happen to him."},{"v":33,"t":"“Behold, we are going up to Jerusalem. The Son of Man will be delivered to the chief priests and the scribes. They will condemn him to death, and will deliver him to the Gentiles."},{"v":34,"t":"They will mock him, spit on him, scourge him, and kill him. On the third day he will rise again.”"},{"v":35,"t":"James and John, the sons of Zebedee, came near to him, saying, “Teacher, we want you to do for us whatever we will ask.”"},{"v":36,"t":"He said to them, “What do you want me to do for you?”"},{"v":37,"t":"They said to him, “Grant to us that we may sit, one at your right hand, and one at your left hand, in your glory.”"},{"v":38,"t":"But Jesus said to them, “You don’t know what you are asking. Are you able to drink the cup that I drink, and to be baptized with the baptism that I am baptized with?”"},{"v":39,"t":"They said to him, “We are able.” Jesus said to them, “You shall indeed drink the cup th
